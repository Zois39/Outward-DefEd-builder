<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1410">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Outward Builder">
    <title>Outward Build Builder</title>
    <style>
        :root {
            --bg: #1a1410;
            --bg2: #241c12;
            --bg3: #2a2118;
            --panel: #2a2118;
            --panel2: #33291d;
            --panel3: #3a2f1e;
            --gold: #c9a227;
            --gold2: #e8c547;
            --gold3: #f0d060;
            --brown: #8b4513;
            --brown2: #a0522d;
            --text: #e8dcc8;
            --dim: #a89878;
            --dim2: #7a6a55;
            --red: #c0392b;
            --red2: #e74c3c;
            --green: #27ae60;
            --green2: #2ecc71;
            --blue: #2980b9;
            --blue2: #3498db;
            --purple: #8e44ad;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior-y: none;
        }

        #root { min-height: 100vh; min-height: 100dvh; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 0; height: 0; }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #1a1410 0%, #241c12 40%, #1a1410 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 24px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            position: relative;
        }

        .logo-sword {
            position: absolute;
            width: 8px;
            height: 80px;
            background: linear-gradient(180deg, var(--gold3) 0%, var(--gold) 50%, var(--brown) 100%);
            border-radius: 4px;
            top: 10px;
            left: 46px;
            transform-origin: center 70%;
        }

        .logo-sword:before {
            content: '';
            position: absolute;
            width: 24px;
            height: 6px;
            background: var(--brown);
            border-radius: 3px;
            top: 52px;
            left: -8px;
        }

        .logo-sword:after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--gold);
            border-radius: 50%;
            top: 62px;
            left: -2px;
        }

        .logo-sword.left { transform: rotate(-45deg); }
        .logo-sword.right { transform: rotate(45deg); }

        .loading-title {
            font-size: 32px;
            color: var(--gold);
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 20px rgba(201, 162, 39, 0.3);
        }

        .loading-subtitle {
            font-size: 14px;
            color: var(--dim);
            margin-bottom: 48px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .loading-bar-wrap {
            width: 260px;
            height: 4px;
            background: var(--panel2);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid var(--brown);
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--brown), var(--gold), var(--gold2));
            border-radius: 2px;
            transition: width 0.4s ease;
            box-shadow: 0 0 12px rgba(201, 162, 39, 0.4);
        }

        .loading-status {
            margin-top: 16px;
            font-size: 13px;
            color: var(--dim);
            letter-spacing: 0.5px;
        }

        .loading-error {
            margin-top: 24px;
            padding: 14px 18px;
            background: rgba(192, 57, 43, 0.15);
            border: 1px solid var(--red);
            border-radius: 10px;
            color: var(--red2);
            font-size: 14px;
            text-align: center;
            max-width: 300px;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 16px;
            padding: 12px 28px;
            background: var(--brown);
            border: 1px solid var(--gold);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
        }

        /* ===== HOME SCREEN ===== */
        .home-screen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
        }

        .home-hero {
            text-align: center;
            padding: 100px 24px 48px;
            padding-top: calc(100px + var(--sat));
        }

        .home-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
        }

        .home-title {
            font-size: 38px;
            color: var(--gold);
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 30px rgba(201, 162, 39, 0.25);
        }

        .home-subtitle {
            font-size: 15px;
            color: var(--dim);
            font-style: italic;
            letter-spacing: 1px;
        }

        .home-stats-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
        }

        .home-stat-pill {
            text-align: center;
            padding: 10px 16px;
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 10px;
        }

        .home-stat-num {
            font-size: 20px;
            color: var(--gold);
            font-weight: 700;
        }

        .home-stat-label {
            font-size: 10px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .home-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--panel) 0%, var(--panel2) 100%);
            border: 2px solid var(--brown);
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            color: var(--text);
            font-family: inherit;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .menu-btn:hover:before, .menu-btn:active:before {
            opacity: 1;
        }

        .menu-btn:hover, .menu-btn:active {
            border-color: var(--gold);
            background: linear-gradient(135deg, var(--panel2) 0%, var(--panel3) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--brown);
            font-size: 24px;
            flex-shrink: 0;
        }

        .menu-content { flex: 1; }
        .menu-content h3 {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 3px;
            font-weight: 600;
        }
        .menu-content p {
            font-size: 13px;
            color: var(--dim);
            line-height: 1.4;
        }

        .menu-arrow {
            color: var(--brown);
            font-size: 18px;
            flex-shrink: 0;
        }

        .home-footer {
            text-align: center;
            padding: 24px;
            padding-bottom: calc(24px + var(--sab));
            font-size: 12px;
            color: var(--dim2);
        }

        /* ===== BUILDER ===== */
        .builder-screen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .builder-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            padding-top: calc(10px + var(--sat));
            background: var(--bg2);
            border-bottom: 1px solid var(--brown);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text);
            font-size: 16px;
            flex-shrink: 0;
        }

        .header-title {
            flex: 1;
            font-size: 16px;
            color: var(--gold);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-level {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--dim);
        }

        .level-input {
            width: 48px;
            padding: 6px 4px;
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 6px;
            color: var(--gold);
            font-size: 14px;
            text-align: center;
            font-family: inherit;
            font-weight: 600;
        }

        .theory-toggle {
            padding: 6px 10px;
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 6px;
            color: var(--dim);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .theory-toggle.active {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
            font-weight: 600;
        }

        /* Content area */
        .builder-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(72px + var(--sab));
        }

        /* Tab bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: rgba(26, 20, 16, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--brown);
            padding: 6px 8px calc(6px + var(--sab));
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--dim);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.5px;
            border-radius: 8px;
            transition: all 0.15s;
        }

        .tab-btn.active {
            color: var(--gold);
            background: rgba(201, 162, 39, 0.1);
        }

        .tab-icon { font-size: 22px; line-height: 1; }

        /* Tab panes */
        .tab-pane { display: none; flex: 1; overflow-y: auto; }
        .tab-pane.active { display: block; }

        /* ===== STATS TAB ===== */
        .stats-container {
            padding: 14px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Hero stats card */
        .stats-hero {
            background: linear-gradient(135deg, var(--panel) 0%, var(--panel2) 100%);
            border: 1px solid var(--brown);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .stats-hero:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--red), var(--gold), var(--green), var(--blue));
        }

        .hero-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .hero-stat {
            text-align: center;
            padding: 12px 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .hero-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .hero-value {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }

        .hero-value.health { color: var(--red2); }
        .hero-value.stamina { color: var(--green2); }
        .hero-value.mana { color: var(--blue2); }

        .hero-label {
            font-size: 10px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
        }

        /* Points summary */
        .points-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .point-card {
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .point-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 10px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .point-info h4 {
            font-size: 11px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .point-info .val {
            font-size: 18px;
            color: var(--gold);
            font-weight: 700;
        }

        .point-info .val.warning { color: var(--red); }

        /* Section cards */
        .section-card {
            background: var(--panel);
            border: 1px solid var(--brown);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--panel2);
            border-bottom: 1px solid var(--brown);
        }

        .section-icon {
            font-size: 18px;
        }

        .section-title {
            font-size: 13px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .section-body {
            padding: 4px 16px 12px;
        }

        /* Stat rows */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid rgba(139, 69, 19, 0.2);
            font-size: 14px;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-name {
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .stat-dot.physical { background: #95a5a6; }
        .stat-dot.fire { background: #e74c3c; }
        .stat-dot.frost { background: #3498db; }
        .stat-dot.lightning { background: #f1c40f; }
        .stat-dot.decay { background: #2ecc71; }
        .stat-dot.ethereal { background: #9b59b6; }
        .stat-dot.impact { background: #e67e22; }

        .stat-val {
            color: var(--gold);
            font-weight: 600;
            font-size: 15px;
        }

        .stat-val.positive { color: var(--green2); }
        .stat-val.negative { color: var(--red2); }

        /* Resistance grid */
        .resist-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 12px 0;
        }

        .resist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--panel2);
            border-radius: 8px;
        }

        .resist-label {
            font-size: 12px;
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .resist-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
        }

        /* Equipment summary */
        .equip-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px 0;
        }

        .equip-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--panel2);
            border-radius: 6px;
            font-size: 11px;
        }

        .equip-chip img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .equip-chip span {
            color: var(--text);
        }

        .equip-empty {
            color: var(--dim2);
            font-size: 13px;
            padding: 16px 0;
            text-align: center;
            font-style: italic;
        }

        /* Skills list */
        .skill-list {
            padding: 8px 0;
        }

        .skill-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            margin: 3px;
            background: var(--panel2);
            border: 1px solid var(--brown);
            border-radius: 6px;
            font-size: 12px;
        }

        .skill-tag img {
            width: 18px;
            height: 18px;
            border-radius: 3px;
        }

        /* Set bonuses */
        .set-bonus {
            padding: 10px 12px;
            margin: 6px 0;
            background: rgba(201, 162, 39, 0.08);
            border: 1px solid rgba(201, 162, 39, 0.3);
            border-radius: 8px;
            font-size: 12px;
        }

        .set-bonus-name {
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 4px;
        }

        /* Desktop */
        @media (min-width: 900px) {
            .home-menu { max-width: 440px; }
            .builder-content {
                display: grid;
                grid-template-columns: 300px 1fr 340px;
                gap: 0;
                padding-bottom: 0;
            }
            .tab-pane { display: block !important; border-right: 1px solid var(--brown); }
            .tab-pane:last-child { border-right: none; }
            .tab-bar { display: none; }
            .stats-container { max-width: none; }
        }

        @media (max-width: 380px) {
            .home-title { font-size: 28px; letter-spacing: 4px; }
            .hero-value { font-size: 26px; }
            .points-summary { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
    // ===== DATA =====
    var DATA_BASE = 'https://raw.githubusercontent.com/Zois39/Outward-DefEd-builder/main/app/public/data/';
    var IMG_BASE = 'https://raw.githubusercontent.com/Zois39/Outward-DefEd-builder/main/app/public/';

    function fetchJSON(path) {
        return fetch(DATA_BASE + path).then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + path);
            return r.json();
        });
    }

    function imgSrc(path) {
        if (!path) return null;
        return IMG_BASE + path;
    }

    function h(tag, props, children) {
        return React.createElement(tag, props || {}, children);
    }

    // ===== SVG LOGO =====
    function Logo(props) {
        var size = props.size || 80;
        return h('svg', {
            width: size, height: size, viewBox: '0 0 100 100',
            style: { display: 'block', margin: '0 auto' }
        },
            // Left sword
            h('g', { transform: 'rotate(-45, 50, 60)'},
                h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: 'url(#goldGrad)'}),
                h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
            ),
            // Right sword
            h('g', { transform: 'rotate(45, 50, 60)'},
                h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: 'url(#goldGrad)'}),
                h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
            ),
            h('defs', null,
                h('linearGradient', {id: 'goldGrad', x1: '0%', y1: '0%', x2: '0%', y2: '100%'},
                    h('stop', {offset: '0%', stopColor: '#f0d060'}),
                    h('stop', {offset: '50%', stopColor: '#c9a227'}),
                    h('stop', {offset: '100%', stopColor: '#8b4513'})
                )
            )
        );
    }

    // ===== LOADING =====
    function LoadingScreen(props) {
        return h('div', {className: 'loading-screen'},
            h('div', {className: 'logo-container'},
                h(Logo, {size: 100})
            ),
            h('div', {className: 'loading-title'}, 'Outward'),
            h('div', {className: 'loading-subtitle'}, 'Build Builder'),
            h('div', {className: 'loading-bar-wrap'},
                h('div', {className: 'loading-bar', style: {width: props.progress + '%'}})
            ),
            h('div', {className: 'loading-status'}, props.status),
            props.error ? h('div', {className: 'loading-error'}, props.error) : null,
            props.error ? h('button', {className: 'retry-btn', onClick: props.onRetry}, 'Retry') : null
        );
    }

    // ===== HOME =====
    function HomeScreen(props) {
        var data = props.data;
        var skillCount = data ? data.skills.length : 0;
        var weaponCount = data ? data.weapons.length : 0;
        var armorCount = data ? data.armor.length : 0;

        return h('div', {className: 'home-screen'},
            h('div', {className: 'home-hero'},
                h('div', {className: 'home-logo'},
                    h(Logo, {size: 80})
                ),
                h('div', {className: 'home-title'}, 'Outward'),
                h('div', {className: 'home-subtitle'}, 'Definitive Edition Build Builder'),
                h('div', {className: 'home-stats-row'},
                    h('div', {className: 'home-stat-pill'},

    // ===== STATS TAB =====
    function StatsTab(props) {
        var data = props.data;
        var build = props.build;

        var stats = React.useMemo(function() {
            var result = {
                health: 100, stamina: 100, mana: 20,
                protection: 0, impactResist: 0,
                resistances: {physical: 0, fire: 0, frost: 0, lightning: 0, decay: 0, ethereal: 0},
                staminaCost: 0, manaCost: 0,
                moveSpeed: 0, coldResist: 0, heatResist: 0, pouch: 0
            };

            // Equipment
            Object.keys(build.equipment).forEach(function(slotId) {
                var name = build.equipment[slotId];
                if (!name) return;

                var armor = data.armor.find(function(a) { return a.name === name; });
                if (armor) {
                    result.protection += armor.protection || 0;
                    result.impactResist += (armor.resistances && armor.resistances.impact) || 0;
                    result.staminaCost += armor.stamina_cost_reduction || 0;
                    result.manaCost += armor.mana_cost_reduction || 0;
                    result.moveSpeed += armor.move_speed || 0;
                    result.coldResist += armor.cold_resist || 0;
                    result.heatResist += armor.heat_resist || 0;
                    result.pouch += armor.pouch || 0;

                    if (armor.resistances) {
                        ['physical','fire','frost','lightning','decay','ethereal'].forEach(function(k) {
                            if (armor.resistances[k]) {
                                result.resistances[k] = (result.resistances[k] || 0) + armor.resistances[k];
                            }
                        });
                    }
                }
            });

            // Skills
            build.skills.forEach(function(name) {
                var skill = data.skills.find(function(s) { return s.name === name; });
                if (skill && skill.effects) {
                    var m = skill.effects.match(/([+-])([0-9]+)[\s]*(health|stamina|mana)/i);
                    if (m) {
                        var key = m[3].toLowerCase();
                        result[key] += parseInt(m[2]) * (m[1] === '-' ? -1 : 1);
                    }
                }
            });

            return result;
        }, [data, build]);

        var pointsUsed = build.skills.length;
        var pointsLeft = build.theorycraft ? '∞' : (build.level - pointsUsed);
        var breakthroughsLeft = 3 - build.breakthroughsUsed;

        // Equipment names for display
        var equippedItems = Object.keys(build.equipment)
            .map(function(slotId) {
                var name = build.equipment[slotId];
                if (!name) return null;
                var item = data.armor.find(function(a) { return a.name === name; }) ||
                           data.weapons.find(function(w) { return w.name === name; });
                return item ? {slot: slotId, item: item} : null;
            })
            .filter(Boolean);

        // Selected skills
        var selectedSkills = build.skills.map(function(name) {
            return data.skills.find(function(s) { return s.name === name; });
        }).filter(Boolean);

        function StatRow(label, value, opts) {
            opts = opts || {};
            var cls = 'stat-val';
            if (value > 0 && !opts.noPlus) cls += ' positive';
            if (value < 0) cls += ' negative';
            var display = (value > 0 && !opts.noPlus ? '+' : '') + value + (opts.suffix || '');
            if (opts.noPlus && value > 0) display = value + (opts.suffix || '');

            return h('div', {className: 'stat-row'},
                h('span', {className: 'stat-name'},
                    opts.dot ? h('span', {className: 'stat-dot ' + opts.dot}) : null,
                    label
                ),
                h('span', {className: cls}, display)
            );
        }

        return h('div', {className: 'stats-container'},
            // Hero stats
            h('div', {className: 'stats-hero'},
                h('div', {className: 'hero-row'},
                    h('div', {className: 'hero-stat'},
                        h('div', {className: 'hero-icon'}, '❤️'),
                        h('div', {className: 'hero-value health'}, stats.health),
                        h('div', {className: 'hero-label'}, 'Health')
                    ),
                    h('div', {className: 'hero-stat'},
                        h('div', {className: 'hero-icon'}, '⚡'),
                        h('div', {className: 'hero-value stamina'}, stats.stamina),
                        h('div', {className: 'hero-label'}, 'Stamina')
                    ),
                    h('div', {className: 'hero-stat'},
                        h('div', {className: 'hero-icon'}, '🔮'),
                        h('div', {className: 'hero-value mana'}, stats.mana),
                        h('div', {className: 'hero-label'}, 'Mana')
                    )
                )
            ),

            // Points summary
            h('div', {className: 'points-summary'},
                h('div', {className: 'point-card'},
                    h('div', {className: 'point-icon'}, '⚡'),
                    h('div', {className: 'point-info'},
                        h('h4', null, 'Skill Points'),
                        h('div', {className: 'val' + (pointsLeft < 0 ? ' warning' : '')}, 
                            pointsUsed + ' / ' + (build.theorycraft ? '∞' : build.level))
                    )
                ),
                h('div', {className: 'point-card'},
                    h('div', {className: 'point-icon'}, '💫'),
                    h('div', {className: 'point-info'},
                        h('h4', null, 'Breakthroughs'),
                        h('div', {className: 'val' + (breakthroughsLeft <= 0 ? ' warning' : '')},
                            build.breakthroughsUsed + ' / 3')
                    )
                )
            ),

            // Defense
            h('div', {className: 'section-card'},
                h('div', {className: 'section-header'},
                    h('span', {className: 'section-icon'}, '🛡️'),
                    h('span', {className: 'section-title'}, 'Defense')
                ),
                h('div', {className: 'section-body'},
                    StatRow('Protection', stats.protection, {noPlus: true}),
                    StatRow('Impact Resistance', stats.impactResist, {noPlus: true}),

                    h('div', {className: 'resist-grid'},
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot physical'}),
                                'Physical'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.physical || 0)
                        ),
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot fire'}),
                                'Fire'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.fire || 0)
                        ),
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot frost'}),
                                'Frost'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.frost || 0)
                        ),
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot lightning'}),
                                'Lightning'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.lightning || 0)
                        ),
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot decay'}),
                                'Decay'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.decay || 0)
                        ),
                        h('div', {className: 'resist-item'},
                            h('span', {className: 'resist-label'},
                                h('span', {className: 'stat-dot ethereal'}),
                                'Ethereal'
                            ),
                            h('span', {className: 'resist-val'}, stats.resistances.ethereal || 0)

                )
            ),

            // Modifiers
            h('div', {className: 'section-card'},
                h('div', {className: 'section-header'},

                    h('span', {className: 'section-title'}, 'Modifiers')
                ),
                h('div', {className: 'section-body'},
                    StatRow('Stamina Cost', -stats.staminaCost, {suffix: '%'}),
                    StatRow('Mana Cost', -stats.manaCost, {suffix: '%'}),
                    StatRow('Movement Speed', stats.moveSpeed, {suffix: '%'}),
                    StatRow('Cold Protection', stats.coldResist, {noPlus: true}),
                    StatRow('Heat Protection', stats.heatResist, {noPlus: true}),
                    StatRow('Pouch Bonus', stats.pouch, {noPlus: true})
                )
            ),

            // Equipment summary
            h('div', {className: 'section-card'},
                h('div', {className: 'section-header'},

    // ===== SKILLS TAB =====
    function SkillsTab(props) {
        var data = props.data;
        var build = props.build;
        var setBuild = props.setBuild;

        var searchState = React.useState('');
        var search = searchState[0], setSearch = searchState[1];

        var filterState = React.useState(null);
        var filterClass = filterState[0], setFilterClass = filterState[1];

        var expandedState = React.useState(data.classes[0] ? data.classes[0].name : null);
        var expandedClass = expandedState[0], setExpandedClass = expandedState[1];

        var filteredSkills = React.useMemo(function() {
            var list = data.skills;
            if (filterClass) list = list.filter(function(s) { return s.parent_class === filterClass; });
            if (search) {
                var q = search.toLowerCase();
                list = list.filter(function(s) {
                    return s.name.toLowerCase().indexOf(q) >= 0 ||
                           (s.effects && s.effects.toLowerCase().indexOf(q) >= 0);
                });
            }
            return list;
        }, [data.skills, search, filterClass]);

        var skillsByClass = React.useMemo(function() {
            var map = {};
            filteredSkills.forEach(function(s) {
                if (!map[s.parent_class]) map[s.parent_class] = [];
                map[s.parent_class].push(s);
            });
            Object.keys(map).forEach(function(k) {
                map[k].sort(function(a, b) {
                    var order = function(t) { return t === 0 ? 4 : t; };
                    return order(a.tier) - order(b.tier);
                });
            });
            return map;
        }, [filteredSkills]);

        var pointsUsed = build.skills.length;
        var pointsLeft = build.theorycraft ? 999 : build.level - pointsUsed;

        function toggleSkill(skill) {
            var isSelected = build.skills.indexOf(skill.name) >= 0;
            var isBreakthrough = skill.costs_breakthrough;

            if (isSelected) {
                setBuild(Object.assign({}, build, {
                    skills: build.skills.filter(function(s) { return s !== skill.name; }),
                    breakthroughsUsed: build.breakthroughsUsed - (isBreakthrough ? 1 : 0)
                }));
            } else {
                if (!build.theorycraft && pointsLeft <= 0) return;
                if (isBreakthrough && !build.theorycraft && build.breakthroughsUsed >= 3) return;
                setBuild(Object.assign({}, build, {
                    skills: build.skills.concat([skill.name]),
                    breakthroughsUsed: build.breakthroughsUsed + (isBreakthrough ? 1 : 0)
                }));
            }
        }

        return h('div', {style: {padding: '14px'}},
            h('input', {
                className: 'search-bar',
                placeholder: 'Search skills...',
                value: search,
                onChange: function(e) { setSearch(e.target.value); }
            }),

            h('div', {className: 'filter-pills'},
                h('button', {
                    className: 'pill' + (!filterClass ? ' active' : ''),
                    onClick: function() { setFilterClass(null); }
                }, 'All'),
                data.classes.map(function(c) {
                    return h('button', {
                        key: c.name,
                        className: 'pill' + (filterClass === c.name ? ' active' : ''),
                        onClick: function() { setFilterClass(c.name); }
                    }, c.name);
                })
            ),

            data.classes.map(function(cls) {
                var skills = skillsByClass[cls.name];
                if (!skills || skills.length === 0) return null;
                var isOpen = filterClass === cls.name || expandedClass === cls.name || search.length > 0;

                return h('div', {key: cls.name, className: 'class-section'},
                    h('div', {
                        className: 'class-header',
                        onClick: function() { setExpandedClass(isOpen ? null : cls.name); }
                    },
                        cls.local_image ? h('img', {className: 'class-icon', src: imgSrc(cls.local_image)}) : null,
                        h('div', {className: 'class-info'},
                            h('h3', null, cls.name),
                            h('p', null, cls.teacher + ' — ' + cls.location)
                        ),
                        cls.is_dlc ? h('span', {className: 'class-dlc'}, 'DLC') : null
                    ),
                    isOpen ? h('div', {className: 'skills-list'},
                        skills.map(function(skill) {
                            var isSelected = build.skills.indexOf(skill.name) >= 0;
                            var canAfford = build.theorycraft || pointsLeft > 0 || isSelected;
                            var tierClass = 'skill-tier' + (skill.tier === 2 ? ' t2' : skill.tier === 3 ? ' t3' : '');

                            return h('div', {
                                key: skill.name,
                                className: 'skill-item' + (isSelected ? ' selected' : '') + (!canAfford ? ' locked' : ''),
                                onClick: function() { if (canAfford) toggleSkill(skill); }
                            },
                                skill.local_image ? h('img', {className: 'skill-icon', src: imgSrc(skill.local_image), loading: 'lazy'}) : null,
                                h('div', {className: 'skill-info'},
                                    h('div', {className: 'skill-name'}, skill.name),
                                    h('div', {className: 'skill-meta'},
                                        skill.skill_type +
                                        (skill.subtype ? ' · ' + skill.subtype : '') +
                                        (skill.mana_cost ? ' · ' + skill.mana_cost + ' Mana' : '')
                                    )
                                ),
                                h('span', {className: tierClass}, skill.tier === 0 ? 'SP' : 'T' + skill.tier)
                            );
                        })
                    ) : null
                );
            })
        );
    }

    // ===== EQUIPMENT TAB =====
    function EquipmentTab(props) {
        var data = props.data;
        var build = props.build;
        var setBuild = props.setBuild;

        var pickerState = React.useState(null);
        var pickerSlot = pickerState[0], setPickerSlot = pickerState[1];

        var pickerSearchState = React.useState('');
        var pickerSearch = pickerSearchState[0], setPickerSearch = pickerSearchState[1];

        var slots = [
            {id: 'head', label: 'Head', type: 'armor'},
            {id: 'chest', label: 'Chest', type: 'armor'},
            {id: 'legs', label: 'Legs', type: 'armor'},
            {id: 'back', label: 'Back', type: 'armor'},
            {id: 'weapon_main', label: 'Main', type: 'weapon'},
            {id: 'weapon_off', label: 'Off', type: 'weapon'},
            {id: 'acc1', label: 'Acc 1', type: 'armor'},
            {id: 'acc2', label: 'Acc 2', type: 'armor'},
            {id: 'acc3', label: 'Acc 3', type: 'armor'},
            {id: 'acc4', label: 'Acc 4', type: 'armor'}
        ];

        function getItem(slotId) {
            var name = build.equipment[slotId];
            if (!name) return null;
            return data.weapons.find(function(w) { return w.name === name; }) ||
                   data.armor.find(function(a) { return a.name === name; });
        }

        function getPickerItems() {
            if (!pickerSlot) return [];
            var slot = slots.find(function(s) { return s.id === pickerSlot; });
            var q = pickerSearch.toLowerCase();

            if (slot.type === 'weapon') {
                return data.weapons.filter(function(w) { return !q || w.name.toLowerCase().indexOf(q) >= 0; });
            }

            var slotMap = {
                head: ['head'], chest: ['chest'], legs: ['legs'], back: ['backpack'],
                acc1: ['necklace', 'ring'], acc2: ['necklace', 'ring'],
                acc3: ['necklace', 'ring'], acc4: ['necklace', 'ring']
            };
            var validSlots = slotMap[pickerSlot] || [];
            return data.armor.filter(function(a) {
                return validSlots.indexOf(a.slot) >= 0 && (!q || a.name.toLowerCase().indexOf(q) >= 0);
            });
        }

        var pickerItems = getPickerItems();

        return h('div', {style: {padding: '14px'}},
            h('div', {className: 'equipment-grid'},
                slots.map(function(slot) {
                    var item = getItem(slot.id);
                    return h('div', {
                        key: slot.id,
                        className: 'equip-slot' + (item ? ' filled' : ''),
                        onClick: function() { setPickerSlot(slot.id); setPickerSearch(''); }
                    },
                        item && item.local_image ? h('img', {src: imgSrc(item.local_image), loading: 'lazy'}) : null,
                        h('div', {className: 'slot-label'}, slot.label),
                        item ? h('div', {className: 'item-name'}, item.name) : null
                    );
                })
            ),

            pickerSlot ? h('div', {className: 'modal-overlay', onClick: function() { setPickerSlot(null); }},
                h('div', {className: 'modal', onClick: function(e) { e.stopPropagation(); }},
                    h('div', {className: 'modal-header'},
                        h('div', {className: 'modal-title'},
                            slots.find(function(s) { return s.id === pickerSlot; }).label
                        ),
                        h('button', {className: 'modal-close', onClick: function() { setPickerSlot(null); }}, '✕')
                    ),
                    h('input', {
                        className: 'modal-search',
                        placeholder: 'Search...',
                        value: pickerSearch,
                        onChange: function(e) { setPickerSearch(e.target.value); }
                    }),
                    h('div', {className: 'modal-body'},
                        h('div', {className: 'item-grid'},
                            pickerItems.map(function(item) {
                                return h('div', {
                                    key: item.name,
                                    className: 'item-card',
                                    onClick: function() {
                                        var newEquip = Object.assign({}, build.equipment);
                                        newEquip[pickerSlot] = item.name;
                                        setBuild(Object.assign({}, build, {equipment: newEquip}));
                                        setPickerSlot(null);
                                    }
                                },
                                    item.local_image ? h('img', {src: imgSrc(item.local_image), loading: 'lazy'}) : null,
                                    h('div', {className: 'item-card-name'}, item.name),
                                    item.set_name ? h('div', {className: 'item-card-set'}, item.set_name) : null
                                );
                            }),
                            pickerItems.length === 0 ? h('div', {style: {color: 'var(--dim)', padding: 20}}, 'No items found') : null
                        )
                    )
                )
            ) : null
        );
    }

    // ===== BUILDER =====
    function BuilderScreen(props) {
        var data = props.data;
        var build = props.build;
        var setBuild = props.setBuild;
        var onHome = props.onHome;

        var tabState = React.useState('stats');
        var activeTab = tabState[0], setActiveTab = tabState[1];

        var isDesktop = window.innerWidth >= 900;

        function updateLevel(e) {
            var val = parseInt(e.target.value) || 1;
            val = Math.min(50, Math.max(1, val));

        }

        function toggleTheorycraft() {
            setBuild(Object.assign({}, build, {theorycraft: !build.theorycraft}));
        }

        var tabs = [
            {id: 'stats', icon: '📊', label: 'Stats'},
            {id: 'skills', icon: '⚡', label: 'Skills'},
            {id: 'equip', icon: '🛡️', label: 'Gear'}

        return h('div', {className: 'builder-screen'},
            h('div', {className: 'builder-header'},
                h('button', {className: 'header-btn', onClick: onHome}, '←'),
                h('div', {className: 'header-title'}, build.name || 'New Build'),
                h('button', {
                    className: 'theory-toggle' + (build.theorycraft ? ' active' : ''),
                    onClick: toggleTheorycraft

                h('div', {className: 'header-level'},
                    'Lv',
                    h('input', {
                        type: 'number',

            h('div', {className: 'builder-content'},

                    (isDesktop || activeTab === 'stats') ? StatsTab({data: data, build: build}) : null
                ),
                h('div', {className: 'tab-pane' + (isDesktop || activeTab === 'skills' ? ' active' : '')},
                    (isDesktop || activeTab === 'skills') ? SkillsTab({data: data, build: build, setBuild: setBuild}) : null
                ),
                h('div', {className: 'tab-pane' + (isDesktop || activeTab === 'equip' ? ' active' : '')},
                    (isDesktop || activeTab === 'equip') ? EquipmentTab({data: data, build: build, setBuild: setBuild}) : null

            ),

            !isDesktop ? h('div', {className: 'tab-bar'},
                tabs.map(function(tab) {
                    return h('button', {
                        key: tab.id,
                        className: 'tab-btn' + (activeTab === tab.id ? ' active' : ''),
                        onClick: function() { setActiveTab(tab.id); }
                    },
                        h('span', {className: 'tab-icon'}, tab.icon),
                        h('span', null, tab.label)
                    );
                })
            ) : null
        );

        var error = errorState[0], setError = errorState[1];

        var buildState = React.useState({
            name: 'New Build',
            level: 1,
            theorycraft: false,
            skills: [],
            equipment: {},
            breakthroughsUsed: 0
        });
        var build = buildState[0], setBuild = buildState[1];

        // Load saved build
        React.useEffect(function() {
            try {
                var saved = localStorage.getItem('outward-build');
                if (saved) setBuild(JSON.parse(saved));
            } catch(e) {}
        }, []);

        // Save build
        React.useEffect(function() {
            try {
                localStorage.setItem('outward-build', JSON.stringify(build));
            } catch(e) {}
        }, [build]);

        // Load data
        React.useEffect(function() {
            loadData();
        }, []);

        async function loadData() {
            try {
                setError(null);
                setStatus('Loading skills...');
                setProgress(15);

                var results = await Promise.all([
                    fetchJSON('skills/skills_tier1.json'),
                    fetchJSON('skills/skills_tier2.json'),
                    fetchJSON('skills/skills_tier3.json'),
                    fetchJSON('skills/skills_special.json'),
                    fetchJSON('skills/classes.json')
                ]);

                setProgress(40);
                setStatus('Loading weapons...');

                var weaponResults = await Promise.all([
                    fetchJSON('weapons/weapons_melee.json'),
                    fetchJSON('weapons/weapons_ranged.json'),
                    fetchJSON('weapons/weapons_magical.json'),
                    fetchJSON('weapons/shields.json')
                ]);

                setProgress(60);
                setStatus('Loading armor...');

                var armor = await fetchJSON('armor/armor_items.json');

                setProgress(80);
                setStatus('Processing...');

                await new Promise(function(r) { setTimeout(r, 300); });

                setData({
                    skills: results[0].concat(results[1], results[2], results[3]),
                    classes: results[4],
                    weapons: weaponResults[0].weapons.concat(weaponResults[1].weapons, weaponResults[2].weapons, weaponResults[3].weapons),
                    armor: armor
                });

                setProgress(100);
                setStatus('Ready!');

                setTimeout(function() { setScreen('home'); }, 400);

            } catch(e) {
                setError(e.message || 'Failed to load data. Check your connection.');
                setStatus('Error');
            }
        }

        if (screen === 'loading') {
            return LoadingScreen({
                progress: progress,
                status: status,
                error: error,
                onRetry: function() { loadData(); }
            });
        }

        if (screen === 'home') {
            return HomeScreen({
                data: data,
                onStart: function() { setScreen('builder'); }
            });
        }

        return BuilderScreen({
            data: data,
            build: build,
            setBuild: setBuild,
            onHome: function() { setScreen('home'); }
        });
    }

    // Render
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
