<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Outward Build Builder</title>
<style>
:root{--bg:#1a1410;--bg2:#241c12;--panel:#2a2118;--panel2:#33291d;--panel3:#3a2f1e;--gold:#c9a227;--gold2:#e8c547;--brown:#8b4513;--text:#e8dcc8;--dim:#a89878;--dim2:#7a6a55;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#root{min-height:100vh;min-height:100dvh}
.loading-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1410,#241c12,#1a1410);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.logo-svg{width:70px;height:70px;margin-bottom:18px}
.loading-title{font-size:26px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.loading-sub{font-size:11px;color:var(--dim);margin-bottom:32px;font-style:italic}
.loading-bar-wrap{width:200px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--brown)}
.loading-bar{height:100%;background:linear-gradient(90deg,var(--brown),var(--gold));border-radius:2px;transition:width .4s}
.loading-status{margin-top:10px;font-size:10px;color:var(--dim)}
.loading-error{margin-top:14px;padding:9px 12px;background:rgba(192,57,43,.15);border:1px solid var(--red);border-radius:7px;color:#e74c3c;font-size:11px;text-align:center;max-width:240px}
.retry-btn{margin-top:10px;padding:7px 18px;background:var(--brown);border:1px solid var(--gold);border-radius:5px;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="root">
<!-- Immediate loading UI before React loads -->
<div class="loading-screen">
<div class="logo-svg">
<svg width="70" height="70" viewBox="0 0 100 100" style="display:block;margin:0 auto">
<defs><linearGradient id="gg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f0d060"/><stop offset="50%" stop-color="#c9a227"/><stop offset="100%" stop-color="#8b4513"/></linearGradient></defs>
<g transform="rotate(-45,50,60)"><rect x="46" y="15" width="8" height="55" rx="3" fill="url(#gg)"/><rect x="38" y="62" width="24" height="6" rx="3" fill="#8b4513"/><circle cx="50" cy="74" r="5" fill="#c9a227"/></g>
<g transform="rotate(45,50,60)"><rect x="46" y="15" width="8" height="55" rx="3" fill="url(#gg)"/><rect x="38" y="62" width="24" height="6" rx="3" fill="#8b4513"/><circle cx="50" cy="74" r="5" fill="#c9a227"/></g>
</svg>
</div>
<div class="loading-title">Outward</div>
<div class="loading-sub">Build Builder</div>
<div class="loading-bar-wrap"><div class="loading-bar" style="width:10%"></div></div>
<div class="loading-status">Loading React...</div>
</div>
</div>

<!-- Load React without crossorigin for iOS compatibility -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
// Check if React loaded
if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
    document.getElementById('root').innerHTML = 
        '<div style="padding:40px;text-align:center;color:#c9a227;font-family:sans-serif">' +
        '<h2>Failed to load React</h2>' +
        '<p style="color:#a89878;margin-top:10px;font-size:14px">Check your internet connection</p>' +
        '<button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;' +
        'background:#8b4513;border:1px solid #c9a227;border-radius:8px;color:#e8dcc8;' +
        'cursor:pointer;font-size:16px">Retry</button></div>';
} else {
    // React loaded, run the app
    (function(){
        'use strict';

        var DATA_BASE = 'data/raw/';
        var IMG_BASE = '';

        function fetchJSON(p) {
            return fetch(DATA_BASE + p).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            });
        }

        function imgSrc(p) { return p ? IMG_BASE + p : null; }
        function h(t, p, c) { return React.createElement(t, p || {}, c); }

        // Update loading bar
        var loadingBar = document.querySelector('.loading-bar');
        var loadingStatus = document.querySelector('.loading-status');

        function setProgress(pct, status) {
            if (loadingBar) loadingBar.style.width = pct + '%';
            if (loadingStatus) loadingStatus.textContent = status;
        }

        // Simple App component
        function App() {
            var screenState = React.useState('loading');
            var screen = screenState[0];
            var setScreen = screenState[1];

            var dataState = React.useState(null);
            var data = dataState[0];
            var setData = dataState[1];

            var errorState = React.useState(null);
            var error = errorState[0];
            var setError = errorState[1];

            var buildState = React.useState({
                name: 'New Build',
                level: 1,
                theorycraft: false,
                skills: [],
                armor: {},
                weapons: {},
                consumables: [],
                faction: null,
                breakthroughsUsed: 0,
                controller: {}
            });
            var build = buildState[0];
            var setBuild = buildState[1];

            // Load saved build
            React.useEffect(function() {
                try {
                    var s = localStorage.getItem('outward-build');
                    if (s) setBuild(JSON.parse(s));
                } catch(e) {}
            }, []);

            // Save build
            React.useEffect(function() {
                try {
                    localStorage.setItem('outward-build', JSON.stringify(build));
                } catch(e) {}
            }, [build]);

            // Load data
            React.useEffect(function() {
                loadData();
            }, []);

            function loadData() {
                setError(null);
                setProgress(20, 'Loading skills...');

                Promise.all([
                    fetchJSON('skills/skills_tier1.json'),
                    fetchJSON('skills/skills_tier2.json'),
                    fetchJSON('skills/skills_tier3.json'),
                    fetchJSON('skills/skills_special.json'),
                    fetchJSON('skills/classes.json')
                ]).then(function(r) {
                    setProgress(40, 'Loading weapons...');
                    return Promise.all([
                        Promise.resolve(r),
                        Promise.all([
                            fetchJSON('weapons/weapons_melee.json'),
                            fetchJSON('weapons/weapons_ranged.json'),
                            fetchJSON('weapons/weapons_magical.json'),
                            fetchJSON('weapons/shields.json')
                        ])
                    ]);
                }).then(function(results) {
                    var r = results[0];
                    var w = results[1];
                    setProgress(60, 'Loading armor...');
                    return Promise.all([
                        Promise.resolve(r),
                        Promise.resolve(w),
                        fetchJSON('armor/armor_items.json')
                    ]);
                }).then(function(results) {
                    var r = results[0];
                    var w = results[1];
                    var a = results[2];
                    setProgress(75, 'Loading items...');
                    return Promise.all([
                        Promise.resolve(r),
                        Promise.resolve(w),
                        Promise.resolve(a),
                        fetchJSON('consumables/data.json')
                    ]);
                }).then(function(results) {
                    var r = results[0];
                    var w = results[1];
                    var a = results[2];
                    var c = results[3];
                    setProgress(90, 'Loading factions...');
                    return Promise.all([
                        Promise.resolve(r),
                        Promise.resolve(w),
                        Promise.resolve(a),
                        Promise.resolve(c),
                        fetchJSON('quests/factions.json')
                    ]);
                }).then(function(results) {
                    var r = results[0];
                    var w = results[1];
                    var a = results[2];
                    var c = results[3];
                    var f = results[4];

                    setProgress(100, 'Ready!');

                    setData({
                        skills: r[0].concat(r[1], r[2], r[3]),
                        classes: r[4],
                        weapons: w[0].weapons.concat(w[1].weapons, w[2].weapons, w[3].weapons),
                        armor: a,
                        consumables: c.items || c,
                        factions: f
                    });

                    setTimeout(function() { setScreen('home'); }, 300);
                }).catch(function(e) {
                    setError(e.message || 'Failed to load data');
                    setProgress(0, 'Error');
                });
            }

            // Render loading screen with progress
            if (screen === 'loading') {
                return h('div', {className: 'loading-screen'},
                    h('div', {className: 'logo-svg'},
                        h('svg', {width: 70, height: 70, viewBox: '0 0 100 100', style: {display: 'block', margin: '0 auto'}},
                            h('defs', null,
                                h('linearGradient', {id: 'gg', x1: '0%', y1: '0%', x2: '0%', y2: '100%'},
                                    h('stop', {offset: '0%', stopColor: '#f0d060'}),
                                    h('stop', {offset: '50%', stopColor: '#c9a227'}),
                                    h('stop', {offset: '100%', stopColor: '#8b4513'})
                                )
                            ),
                            h('g', {transform: 'rotate(-45,50,60)'},
                                h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: 'url(#gg)'}),
                                h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                                h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
                            ),
                            h('g', {transform: 'rotate(45,50,60)'},
                                h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: 'url(#gg)'}),
                                h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                                h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
                            )
                        )
                    ),
                    h('div', {className: 'loading-title'}, 'Outward'),
                    h('div', {className: 'loading-sub'}, 'Build Builder'),
                    h('div', {className: 'loading-bar-wrap'},
                        h('div', {className: 'loading-bar', style: {width: '10%'}})
                    ),
                    h('div', {className: 'loading-status'}, 'Loading...'),
                    error ? h('div', {className: 'loading-error'}, error) : null,
                    error ? h('button', {className: 'retry-btn', onClick: function() { loadData(); }}, 'Retry') : null
                );
            }

            // Render home screen
            if (screen === 'home') {
                return h('div', {style: {minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'linear-gradient(180deg, #1a1410, #241c12, #1a1410)'}},
                    h('div', {style: {textAlign: 'center', padding: '80px 24px 40px', paddingTop: 'calc(80px + env(safe-area-inset-top, 0px))'}},
                        h('div', {style: {width: 60, height: 60, margin: '0 auto 16px'}},
                            h('svg', {width: 60, height: 60, viewBox: '0 0 100 100'},
                                h('g', {transform: 'rotate(-45,50,60)'},
                                    h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: '#c9a227'}),
                                    h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                                    h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
                                ),
                                h('g', {transform: 'rotate(45,50,60)'},
                                    h('rect', {x: 46, y: 15, width: 8, height: 55, rx: 3, fill: '#c9a227'}),
                                    h('rect', {x: 38, y: 62, width: 24, height: 6, rx: 3, fill: '#8b4513'}),
                                    h('circle', {cx: 50, cy: 74, r: 5, fill: '#c9a227'})
                                )
                            )
                        ),
                        h('div', {style: {fontSize: 28, color: '#c9a227', letterSpacing: 5, textTransform: 'uppercase', fontWeight: 700, marginBottom: 4}}, 'Outward'),
                        h('div', {style: {fontSize: 12, color: '#a89878', fontStyle: 'italic'}}, 'Definitive Edition Build Builder'),
                        h('div', {style: {display: 'flex', justifyContent: 'center', gap: 8, marginTop: 20, flexWrap: 'wrap'}},
                            h('div', {style: {textAlign: 'center', padding: '5px 10px', background: '#2a2118', border: '1px solid #8b4513', borderRadius: 8}},
                                h('div', {style: {fontSize: 16, color: '#c9a227', fontWeight: 700}}, data.skills.length),
                                h('div', {style: {fontSize: 8, color: '#a89878', textTransform: 'uppercase', letterSpacing: 1, marginTop: 2}}, 'Skills')
                            ),
                            h('div', {style: {textAlign: 'center', padding: '5px 10px', background: '#2a2118', border: '1px solid #8b4513', borderRadius: 8}},
                                h('div', {style: {fontSize: 16, color: '#c9a227', fontWeight: 700}}, data.weapons.length),
                                h('div', {style: {fontSize: 8, color: '#a89878', textTransform: 'uppercase', letterSpacing: 1, marginTop: 2}}, 'Weapons')
                            ),
                            h('div', {style: {textAlign: 'center', padding: '5px 10px', background: '#2a2118', border: '1px solid #8b4513', borderRadius: 8}},
                                h('div', {style: {fontSize: 16, color: '#c9a227', fontWeight: 700}}, data.armor.length),
                                h('div', {style: {fontSize: 8, color: '#a89878', textTransform: 'uppercase', letterSpacing: 1, marginTop: 2}}, 'Armor')
                            )
                        )
                    ),
                    h('div', {style: {flex: 1, display: 'flex', flexDirection: 'column', gap: 8, padding: 14, maxWidth: 320, margin: '0 auto', width: '100%'}},
                        h('button', {
                            style: {display: 'flex', alignItems: 'center', gap: 10, padding: 14, background: 'linear-gradient(135deg, #2a2118, #33291d)', border: '2px solid #8b4513', borderRadius: 10, cursor: 'pointer', textAlign: 'left', color: '#e8dcc8', fontFamily: 'inherit'},
                            onClick: function() { setScreen('builder'); }
                        },
                            h('div', {style: {width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#1a1410', borderRadius: 8, border: '1px solid #8b4513', fontSize: 20}}, '⚔️'),
                            h('div', {style: {flex: 1}},
                                h('h3', {style: {fontSize: 14, color: '#c9a227', marginBottom: 2}}, 'Create Build'),
                                h('p', {style: {fontSize: 11, color: '#a89878'}}, 'Design your character')
                            ),
                            h('div', {style: {color: '#8b4513', fontSize: 16}}, '›')
                        )
                    ),
                    h('div', {style: {textAlign: 'center', padding: 16, paddingBottom: 'calc(16px + env(safe-area-inset-bottom, 0px))', fontSize: 10, color: '#7a6a55'}}, 'outward.wiki.gg')
                );
            }

            // Simple builder placeholder
            return h('div', {style: {minHeight: '100vh', background: '#1a1410', color: '#e8dcc8', padding: 20}},
                h('button', {onClick: function() { setScreen('home'); }, style: {padding: '8px 16px', background: '#8b4513', border: '1px solid #c9a227', borderRadius: 6, color: '#e8dcc8', cursor: 'pointer', marginBottom: 20}}, '← Back'),
                h('h2', {style: {color: '#c9a227', marginBottom: 20}}, 'Builder'),
                h('p', {style: {color: '#a89878'}}, 'Builder UI loading... Data loaded: ' + data.skills.length + ' skills, ' + data.weapons.length + ' weapons, ' + data.armor.length + ' armor pieces')
            );
        }

        // Render app
        ReactDOM.createRoot(document.getElementById('root')).render(h(App));

    })();
}
</script>
</body>
</html>
