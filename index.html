<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Outward Build Builder</title>
<style>
:root{--bg:#1a1410;--bg2:#241c12;--panel:#2a2118;--panel2:#33291d;--panel3:#3a2f1e;--gold:#c9a227;--gold2:#e8c547;--brown:#8b4513;--brown2:#a0522d;--text:#e8dcc8;--dim:#a89878;--dim2:#7a6a55;--red:#c0392b;--red2:#e74c3c;--green:#27ae60;--green2:#2ecc71;--blue:#2980b9;--blue2:#3498db;--purple:#8e44ad;--orange:#e67e22;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#root{min-height:100vh;min-height:100dvh}
::-webkit-scrollbar{width:0;height:0}
.img-rect{width:44px;height:58px;object-fit:cover;border-radius:6px;background:var(--bg)}
.img-rect-sm{width:32px;height:42px;object-fit:cover;border-radius:4px;background:var(--bg)}
.img-square{width:44px;height:44px;object-fit:contain;border-radius:50%;background:var(--bg)}
.loading-screen{position:fixed;inset:0;background:linear-gradient(160deg,#1a1410,#241c12,#1a1410);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.logo-svg{width:70px;height:70px;margin-bottom:18px}
.loading-title{font-size:26px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.loading-sub{font-size:11px;color:var(--dim);margin-bottom:32px;font-style:italic}
.loading-bar-wrap{width:200px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--brown)}
.loading-bar{height:100%;background:linear-gradient(90deg,var(--brown),var(--gold));border-radius:2px;transition:width .4s}
.loading-status{margin-top:10px;font-size:10px;color:var(--dim)}
.loading-error{margin-top:14px;padding:9px 12px;background:rgba(192,57,43,.15);border:1px solid var(--red);border-radius:7px;color:#e74c3c;font-size:11px;text-align:center;max-width:240px}
.retry-btn{margin-top:10px;padding:7px 18px;background:var(--brown);border:1px solid var(--gold);border-radius:5px;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
.home-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg),var(--bg2),var(--bg))}
.home-hero{text-align:center;padding:70px 24px 28px;padding-top:calc(70px + var(--sat))}
.home-logo{width:56px;height:56px;margin:0 auto 14px}
.home-title{font-size:28px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.home-sub{font-size:12px;color:var(--dim);font-style:italic}
.home-stats{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.home-stat-pill{text-align:center;padding:5px 9px;background:var(--panel);border:1px solid var(--brown);border-radius:7px}
.home-stat-num{font-size:15px;color:var(--gold);font-weight:700}
.home-stat-lbl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.home-menu{flex:1;display:flex;flex-direction:column;gap:7px;padding:12px;max-width:320px;margin:0 auto;width:100%}
.menu-btn{display:flex;align-items:center;gap:9px;padding:12px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:2px solid var(--brown);border-radius:10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit}
.menu-btn:active{border-color:var(--gold);transform:scale(.98)}
.menu-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:7px;border:1px solid var(--brown);font-size:19px;flex-shrink:0}
.menu-content{flex:1}
.menu-content h3{font-size:13px;color:var(--gold);margin-bottom:2px}
.menu-content p{font-size:10px;color:var(--dim)}
.menu-arrow{color:var(--brown);font-size:15px}
.home-footer{text-align:center;padding:14px;padding-bottom:calc(14px + var(--sab));font-size:9px;color:var(--dim2)}
.builder-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.builder-header{display:flex;align-items:center;gap:4px;padding:6px 8px;padding-top:calc(6px + var(--sat));background:var(--bg2);border-bottom:1px solid var(--brown);position:sticky;top:0;z-index:50}
.header-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--brown);border-radius:5px;cursor:pointer;color:var(--text);font-size:12px;flex-shrink:0}
.header-title{flex:1;font-size:12px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-lvl{display:flex;align-items:center;gap:2px;font-size:9px;color:var(--dim)}
.lvl-input{width:36px;padding:3px 2px;background:var(--panel);border:1px solid var(--brown);border-radius:4px;color:var(--gold);font-size:11px;text-align:center;font-family:inherit;font-weight:600}
.theory-btn{padding:3px 5px;background:var(--panel);border:1px solid var(--brown);border-radius:4px;color:var(--dim);font-size:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.theory-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.builder-content{flex:1;display:flex;flex-direction:column;padding-bottom:calc(58px + var(--sab))}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(26,20,16,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--brown);padding:2px 0 calc(2px + var(--sab));z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 1px;background:none;border:none;cursor:pointer;color:var(--dim);font-family:inherit;font-size:6px;border-radius:3px}
.tab-btn.active{color:var(--gold);background:rgba(201,162,39,.12)}
.tab-icon{font-size:16px;line-height:1}
.tab-pane{display:none;flex:1;overflow-y:auto}
.tab-pane.active{display:block}
.tab-inner{padding:8px;max-width:420px;margin:0 auto}
.sec-card{background:var(--panel);border:1px solid var(--brown);border-radius:10px;margin-bottom:8px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--brown)}
.sec-icon{font-size:12px}
.sec-title{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.sec-body{padding:2px 10px 6px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(139,69,19,.2);font-size:10px}
.srow:last-child{border-bottom:none}
.sname{color:var(--text);display:flex;align-items:center;gap:4px}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sdot.physical{background:#95a5a6}.sdot.fire{background:#e74c3c}.sdot.frost{background:#3498db}.sdot.lightning{background:#f1c40f}.sdot.decay{background:#2ecc71}.sdot.ethereal{background:#9b59b6}.sdot.impact{background:#e67e22}
.sval{color:var(--gold);font-weight:600;font-size:11px}
.sval.pos{color:var(--green)}.sval.neg{color:var(--red)}
.hero-card{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--brown);border-radius:12px;padding:10px;margin-bottom:8px;position:relative;overflow:hidden}
.hero-card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue))}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hero-stat{text-align:center;padding:6px 3px;background:rgba(0,0,0,.2);border-radius:6px}
.hero-ico{font-size:14px;margin-bottom:1px}
.hero-val{font-size:20px;font-weight:700;line-height:1}
.hero-val.health{color:#e74c3c}.hero-val.stamina{color:#2ecc71}.hero-val.mana{color:#3498db}
.hero-lbl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.pts-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.pts-card{background:var(--panel);border:1px solid var(--brown);border-radius:8px;padding:8px;display:flex;align-items:center;gap:6px}
.pts-ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:5px;font-size:14px;flex-shrink:0}
.pts-info h4{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.pts-val{font-size:12px;color:var(--gold);font-weight:700}
.pts-val.warn{color:var(--red)}
.resist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:6px 0}
.resist-item{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:var(--panel2);border-radius:4px}
.resist-lbl{font-size:8px;color:var(--dim);display:flex;align-items:center;gap:3px}
.resist-val{font-size:10px;font-weight:700;color:var(--gold)}
.equip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 0}
.equip-slot{aspect-ratio:1;background:var(--panel2);border:2px dashed var(--brown);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;text-align:center;position:relative}
.equip-slot.filled{border-style:solid;border-color:var(--gold)}
.equip-slot img{width:28px;height:36px;object-fit:cover;border-radius:3px;margin-bottom:1px}
.slot-lbl{font-size:6px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.slot-item{font-size:7px;margin-top:1px;line-height:1.1}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px;padding:4px 0}
.item-card{background:var(--panel2);border:1px solid var(--brown);border-radius:6px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item-card.sel{border-color:var(--gold);background:var(--panel3)}
.item-card img{width:32px;height:42px;object-fit:cover;border-radius:3px}
.ic-name{font-size:9px;line-height:1.2}
.ic-meta{font-size:7px;color:var(--dim)}
.ic-set{font-size:7px;color:var(--gold)}
.rarity-common{border-color:#95a5a6!important}
.rarity-unique{border-color:var(--gold)!important}
.rarity-crafted{border-color:var(--blue)!important}
.rarity-legacy{border-color:var(--purple)!important}
.rarity-set{border-color:var(--green)!important}
.rarity-quest{border-color:var(--orange)!important}
.search-bar{width:100%;padding:7px 9px;background:var(--panel);border:1px solid var(--brown);border-radius:6px;color:var(--text);font-size:16px;font-family:inherit;margin-bottom:6px}
.filter-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.pill{padding:4px 6px;background:var(--panel);border:1px solid var(--brown);border-radius:12px;cursor:pointer;font-size:8px;color:var(--dim);font-family:inherit}
.pill.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.pill-group{margin-bottom:5px}
.pill-group-label{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:12px 12px 0 0;width:100%;max-height:85vh;max-height:85dvh;display:flex;flex-direction:column}
.modal-hdr{padding:8px 10px;border-bottom:1px solid var(--brown);display:flex;align-items:center;gap:5px}
.modal-title{font-size:12px;color:var(--gold);flex:1}
.modal-close{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--brown);border-radius:4px;cursor:pointer;color:var(--text);font-size:11px}
.modal-search{margin:4px 8px;padding:6px;background:var(--panel2);border:1px solid var(--brown);border-radius:5px;color:var(--text);font-size:16px;font-family:inherit}
.modal-body{flex:1;overflow-y:auto;padding:0 8px 8px}
.skill-item{display:flex;align-items:center;gap:6px;padding:6px;margin-top:2px;background:var(--panel2);border:1px solid transparent;border-radius:4px;cursor:pointer}
.skill-item.sel{border-color:var(--gold);background:var(--panel3)}
.skill-item.locked{opacity:.5}
.skill-item img{width:28px;height:36px;object-fit:cover;border-radius:3px;flex-shrink:0}
.skill-info{flex:1;min-width:0}
.skill-name{font-size:10px}
.skill-meta{font-size:7px;color:var(--dim)}
.skill-tier{padding:1px 4px;background:var(--brown);color:var(--gold);font-size:6px;border-radius:2px;flex-shrink:0}
.skill-tier.t2{background:var(--gold);color:var(--bg)}
.skill-tier.t3{background:#7d6608;color:#fff}
.class-header{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--brown);border-radius:6px;cursor:pointer;user-select:none}
.class-icon{width:28px;height:36px;object-fit:cover;border-radius:3px}
.class-info h3{font-size:11px;color:var(--gold)}
.class-info p{font-size:8px;color:var(--dim)}
.class-dlc{margin-left:auto;padding:1px 4px;background:var(--brown);color:var(--gold);font-size:6px;border-radius:2px;text-transform:uppercase}
.faction-card{background:var(--panel2);border:1px solid var(--brown);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer}
.faction-card.sel{border-color:var(--gold);background:var(--panel3)}
.faction-name{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:2px}
.faction-desc{font-size:9px;color:var(--dim);line-height:1.4}
.cons-item{display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel2);border:1px solid transparent;border-radius:4px;margin-bottom:3px;cursor:pointer}
.cons-item.sel{border-color:var(--gold);background:var(--panel3)}
.cons-item img{width:28px;height:36px;object-fit:cover;border-radius:3px;flex-shrink:0}
.cons-info{flex:1;min-width:0}
.cons-name{font-size:10px}
.cons-type{font-size:7px;color:var(--dim)}
.cons-effects{font-size:7px;color:var(--dim);margin-top:1px}
.chip-row{display:flex;flex-wrap:wrap;gap:3px;padding:4px 0}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 4px;background:var(--panel2);border-radius:3px;font-size:7px}
.chip img{width:12px;height:15px;object-fit:cover;border-radius:2px}
.chip-empty{color:var(--dim2);font-size:9px;padding:6px 0;text-align:center;font-style:italic}
.controller{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:var(--panel);border-radius:10px;margin-bottom:8px}
.controller-row{display:flex;gap:6px;align-items:center}
.controller-btn{width:40px;height:40px;border-radius:7px;background:var(--panel2);border:2px solid var(--brown);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px;color:var(--dim);overflow:hidden}
.controller-btn.filled{border-color:var(--gold)}
.controller-btn img{width:28px;height:36px;object-fit:cover;border-radius:2px}
.controller-label{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.controller-triggers{display:flex;gap:50px}
.controller-dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
.controller-face{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
.dpad-center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--dim2)}
.effect-item{display:flex;align-items:center;gap:7px;padding:7px;background:var(--panel2);border:1px solid transparent;border-radius:5px;margin-bottom:3px}
.effect-item img{width:32px;height:32px;object-fit:contain;border-radius:50%;flex-shrink:0}
.effect-info{flex:1}
.effect-name{font-size:10px;color:var(--gold)}
.effect-desc{font-size:8px;color:var(--dim);margin-top:1px}
.effect-cat{font-size:6px;padding:1px 3px;background:var(--brown);color:var(--gold);border-radius:2px;text-transform:uppercase}
@media(min-width:900px){
.home-menu{max-width:340px}
.builder-content{display:grid;grid-template-columns:240px 1fr 280px;gap:0;padding-bottom:0}
.tab-pane{display:block!important;border-right:1px solid var(--brown)}
.tab-bar{display:none}
.tab-inner{max-width:none}
}
@media(max-width:380px){
.home-title{font-size:20px;letter-spacing:3px}
.hero-val{font-size:17px}
.pts-row{grid-template-columns:1fr}
.equip-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
'use strict';

var DATA_BASE='data/raw/';
var IMG_BASE='';

function fetchJSON(p){return fetch(DATA_BASE+p).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function imgSrc(p){return p?IMG_BASE+p:null}
function h(t,p,c){return React.createElement(t,p||{},c)}

function Logo(props){
var s=props.size||60;
return h('svg',{width:s,height:s,viewBox:'0 0 100 100',style:{display:'block',margin:'0 auto'}},
h('defs',null,
h('linearGradient',{id:'gg',x1:'0%',y1:'0%',x2:'0%',y2:'100%'},
h('stop',{offset:'0%',stopColor:'#f0d060'}),
h('stop',{offset:'50%',stopColor:'#c9a227'}),
h('stop',{offset:'100%',stopColor:'#8b4513'}))),
h('g',{transform:'rotate(-45,50,60)'},
h('rect',{x:46,y:15,width:8,height:55,rx:3,fill:'url(#gg)'}),
h('rect',{x:38,y:62,width:24,height:6,rx:3,fill:'#8b4513'}),
h('circle',{cx:50,cy:74,r:5,fill:'#c9a227'})),
h('g',{transform:'rotate(45,50,60)'},
h('rect',{x:46,y:15,width:8,height:55,rx:3,fill:'url(#gg)'}),
h('rect',{x:38,y:62,width:24,height:6,rx:3,fill:'#8b4513'}),
h('circle',{cx:50,cy:74,r:5,fill:'#c9a227'})));
}

function LoadingScreen(props){
return h('div',{className:'loading-screen'},
h('div',{className:'logo-svg'},h(Logo,{size:60})),
h('div',{className:'loading-title'},'Outward'),
h('div',{className:'loading-sub'},'Build Builder'),
h('div',{className:'loading-bar-wrap'},
h('div',{className:'loading-bar',style:{width:props.progress+'%'}})),
h('div',{className:'loading-status'},props.status),
props.error?h('div',{className:'loading-error'},props.error):null,
props.error?h('button',{className:'retry-btn',onClick:props.onRetry},'Retry'):null);
}

function HomeScreen(props){
var d=props.data;
return h('div',{className:'home-screen'},
h('div',{className:'home-hero'},
h('div',{className:'home-logo'},h(Logo,{size:56})),
h('div',{className:'home-title'},'Outward'),
h('div',{className:'home-sub'},'Definitive Edition Build Builder'),
h('div',{className:'home-stats'},
h('div',{className:'home-stat-pill'},
h('div',{className:'home-stat-num'},d.skills.length),
h('div',{className:'home-stat-lbl'},'Skills')),
h('div',{className:'home-stat-pill'},
h('div',{className:'home-stat-num'},d.weapons.length),
h('div',{className:'home-stat-lbl'},'Weapons')),
h('div',{className:'home-stat-pill'},
h('div',{className:'home-stat-num'},d.armor.length),
h('div',{className:'home-stat-lbl'},'Armor')),
h('div',{className:'home-stat-pill'},
h('div',{className:'home-stat-num'},d.consumables.length),
h('div',{className:'home-stat-lbl'},'Items')))),
h('div',{className:'home-menu'},
h('button',{className:'menu-btn',onClick:props.onStart},
h('div',{className:'menu-icon'},'⚔️'),
h('div',{className:'menu-content'},
h('h3',null,'Create Build'),
h('p',null,'Design your character')),
h('div',{className:'menu-arrow'},'›'))),
h('div',{className:'home-footer'},'outward.wiki.gg'));
}

function ControllerButton(props){
var skill=props.skill;
var label=props.label;
var onClear=props.onClear;
var color=props.color||'var(--dim)';

return h('div',{style:{textAlign:'center'}},
h('div',{
className:'controller-btn'+(skill?' filled':''),
onClick:onClear
},
skill&&skill.local_image?
h('img',{src:imgSrc(skill.local_image)}):
h('span',{style:{color:color}},label)),
h('div',{className:'controller-label'},label));

w.local_image?h('img',{src:imgSrc(w.local_image),loading:'lazy'}):null,
h('div',{className:'ic-name'},w.name),
h('div',{className:'ic-meta'},
w.weapon_type+(w.handedness?' · '+w.handedness:'')),
w.damage_stats&&w.damage_stats.base_damage?
h('div',{className:'ic-meta'},
Object.keys(w.damage_stats.base_damage).filter(function(k){return w.damage_stats.base_damage[k]>0}).slice(0,3).map(function(k){
return k.substring(0,3)+': '+w.damage_stats.base_damage[k];
}).join(' | ')):null);
}),
pickerItems.length===0?
h('div',{style:{color:'var(--dim)',padding:20,textAlign:'center'}},'No weapons found'):

);

function SkillsTab(props){
var data=props.data;
var build=props.build;
var setBuild=props.setBuild;

var searchState=React.useState('');
var search=searchState[0];
var setSearch=searchState[1];

var filterState=React.useState(null);
var filterClass=filterState[0];
var setFilterClass=filterState[1];

var expandedState=React.useState(data.classes[0]?data.classes[0].name:null);
var expandedClass=expandedState[0];
var setExpandedClass=expandedState[1];

var filtered=React.useMemo(function(){
var list=data.skills;
if(filterClass)list=list.filter(function(s){return s.parent_class===filterClass});
if(search){
var q=search.toLowerCase();
list=list.filter(function(s){
return s.name.toLowerCase().indexOf(q)>=0||
(s.effects&&s.effects.toLowerCase().indexOf(q)>=0);
});
}
return list;
},[data.skills,search,filterClass]);

var byClass=React.useMemo(function(){
var map={};
filtered.forEach(function(s){
if(!map[s.parent_class])map[s.parent_class]=[];
map[s.parent_class].push(s);
});
Object.keys(map).forEach(function(k){
map[k].sort(function(a,b){
var o=function(t){return t===0?4:t};
return o(a.tier)-o(b.tier);
});
});
return map;
},[filtered]);

var ptsUsed=(build.skills||[]).length;
var ptsLeft=build.theorycraft?999:build.level-ptsUsed;

function isSkillLocked(skill){
if(build.theorycraft)return false;
if((build.skills||[]).indexOf(skill.name)>=0)return false;
if(skill.costs_breakthrough&&(build.breakthroughsUsed||0)>=3)return true;
if(ptsLeft<=0)return true;
return false;
}

function toggleSkill(skill){
var isSel=(build.skills||[]).indexOf(skill.name)>=0;
var isBT=skill.costs_breakthrough;

if(isSel){
setBuild(Object.assign({},build,{
skills:(build.skills||[]).filter(function(s){return s!==skill.name}),
breakthroughsUsed:(build.breakthroughsUsed||0)-(isBT?1:0)
}));
}else{
if(!build.theorycraft&&ptsLeft<=0)return;
if(isBT&&!build.theorycraft&&(build.breakthroughsUsed||0)>=3)return;
setBuild(Object.assign({},build,{
skills:(build.skills||[]).concat([skill.name]),
breakthroughsUsed:(build.breakthroughsUsed||0)+(isBT?1:0)
}));
}
}

return h('div',{className:'tab-inner'},
h('input',{
className:'search-bar',
placeholder:'Search skills...',
value:search,
onChange:function(e){setSearch(e.target.value);}
}),

h('div',{className:'filter-pills'},
h('button',{
className:'pill'+(!filterClass?' active':''),
onClick:function(){setFilterClass(null);}
},'All'),
data.classes.map(function(c){
return h('button',{
key:c.name,
className:'pill'+(filterClass===c.name?' active':''),
onClick:function(){setFilterClass(c.name);}
},c.name);
})),

data.classes.map(function(cls){
var skills=byClass[cls.name];
if(!skills||!skills.length)return null;
var isOpen=filterClass===cls.name||expandedClass===cls.name||search.length>0;

return h('div',{key:cls.name,style:{marginBottom:10}},
h('div',{
className:'class-header',
onClick:function(){setExpandedClass(isOpen?null:cls.name);}
},
cls.local_image?h('img',{className:'class-icon',src:imgSrc(cls.local_image)}):null,
h('div',{className:'class-info'},
h('h3',null,cls.name),
h('p',null,cls.teacher+' — '+cls.location)),
cls.is_dlc?h('span',{className:'class-dlc'},'DLC'):null),

isOpen?h('div',{className:'skills-list'},
skills.map(function(skill){
var isSel=(build.skills||[]).indexOf(skill.name)>=0;
var locked=isSkillLocked(skill);

return h('div',{
key:skill.name,
className:'skill-item'+(isSel?' sel':'')+(locked?' locked':''),
onClick:function(){if(!locked||isSel)toggleSkill(skill);}
},
skill.local_image?h('img',{src:imgSrc(skill.local_image),loading:'lazy'}):null,
h('div',{className:'skill-info'},
h('div',{className:'skill-name'},skill.name),
h('div',{className:'skill-meta'},
skill.skill_type+
(skill.subtype?' · '+skill.subtype:'')+
(skill.mana_cost?' · '+skill.mana_cost+' Mana':'')+
(skill.stamina_cost?' · '+skill.stamina_cost+' Stam':'')+
(skill.cooldown?' · CD '+skill.cooldown:'')),
skill.effects?h('div',{className:'skill-meta',style:{marginTop:2}},skill.effects.substring(0,70)+(skill.effects.length>70?'...':'')):null),
h('span',{
className:'skill-tier'+(skill.tier===2?' t2':skill.tier===3?' t3':'')
},skill.tier===0?'SP':(skill.costs_breakthrough?'BT T'+skill.tier:'T'+skill.tier)));
})):null);
}));
}

function ConsumablesTab(props){

return h('div',{className:'tab-inner'},

filtered.map(function(c){

return h('div',{
key:c.name,
className:'cons-item'+(isSel?' sel':''),
onClick:function(){toggleCons(c);}
},
c.local_image?h('img',{src:imgSrc(c.local_image),loading:'lazy'}):null,
h('div',{className:'cons-info'},
h('div',{className:'cons-name'},c.name),
h('div',{className:'cons-type'},
c.consumable_type+
(c.weight?' · '+c.weight+'kg':'')+
(c.price?' · '+c.price+'s':'')),
c.description?
h('div',{className:'cons-effects'},
c.description.substring(0,50)+(c.description.length>50?'...':'')):
null));

function BuilderScreen(props){
var data=props.data;
var build=props.build;
var setBuild=props.setBuild;
var onHome=props.onHome;

var tabState=React.useState('stats');
var activeTab=tabState[0];
var setActiveTab=tabState[1];

var isDesktop=window.innerWidth>=900;

function updateLevel(e){
var v=parseInt(e.target.value)||1;
v=Math.min(50,Math.max(1,v));
setBuild(Object.assign({},build,{level:v}));
}

function resetBuild(){
if(confirm('Reset build?')){
setBuild({
name:'New Build',
level:1,
theorycraft:false,
skills:[],
armor:{},
weapons:{},
consumables:[],
faction:null,
breakthroughsUsed:0,
controller:{}
});
}
}

function exportBuild(){
var json=JSON.stringify(build,null,2);
var blob=new Blob([json],{type:'application/json'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download=(build.name||'build').replace(/\s+/g,'_')+'.json';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}

function importBuild(){
var input=document.createElement('input');
input.type='file';
input.accept='.json';
input.onchange=function(){
var f=input.files[0];
if(!f)return;
var reader=new FileReader();
reader.onload=function(){
try{
var d=JSON.parse(reader.result);
setBuild(Object.assign({},build,d));
}catch(e){
alert('Invalid build file');
}
};
reader.readAsText(f);
};
input.click();
}

var tabs=[
{id:'stats',icon:'',label:'Stats'},
{id:'armor',icon:'️',label:'Armor'},
{id:'weapons',icon:'⚔️',label:'Weapons'},
{id:'skills',icon:'⚡',label:'Skills'},
{id:'factions',icon:'',label:'Factions'},
{id:'consumables',icon:'',label:'Items'},
{id:'effects',icon:'',label:'Effects'}
];

function renderTab(id){
if(id==='stats')return StatsTab({data:data,build:build,setBuild:setBuild});
if(id==='armor')return ArmorTab({data:data,build:build,setBuild:setBuild});
if(id==='weapons')return WeaponsTab({data:data,build:build,setBuild:setBuild});
if(id==='skills')return SkillsTab({data:data,build:build,setBuild:setBuild});
if(id==='factions')return FactionsTab({data:data,build:build,setBuild:setBuild});
if(id==='consumables')return ConsumablesTab({data:data,build:build,setBuild:setBuild});
if(id==='effects')return EffectsTab({data:data});
return null;
}

return h('div',{className:'builder-screen'},
h('div',{className:'builder-header'},
h('button',{className:'header-btn',onClick:onHome},'←'),
h('div',{className:'header-title'},build.name||'New Build'),
h('button',{
className:'theory-btn'+(build.theorycraft?' active':''),
onClick:function(){
setBuild(Object.assign({},build,{theorycraft:!build.theorycraft}));
}
},'Theory'),
h('button',{className:'header-btn',onClick:exportBuild,title:'Export'},'⬇'),
h('button',{className:'header-btn',onClick:importBuild,title:'Import'},'⬆'),
h('button',{className:'header-btn',onClick:resetBuild,title:'Reset'},'✕'),
h('div',{className:'header-lvl'},'Lv',
h('input',{
type:'number',
className:'lvl-input',
min:1,
max:50,
value:build.level,
onChange:updateLevel
}))),

h('div',{className:'builder-content'},
tabs.map(function(tab){
return h('div',{
key:tab.id,
className:'tab-pane'+(isDesktop||activeTab===tab.id?' active':'')
},
(isDesktop||activeTab===tab.id)?renderTab(tab.id):null);
})),

!isDesktop?h('div',{className:'tab-bar'},
tabs.map(function(tab){
return h('button',{
key:tab.id,
className:'tab-btn'+(activeTab===tab.id?' active':''),
onClick:function(){setActiveTab(tab.id);}
},
h('span',{className:'tab-icon'},tab.icon),
h('span',null,tab.label));
})):null
);
}

function App(){
var screenState=React.useState('loading');
var screen=screenState[0];
var setScreen=screenState[1];

var dataState=React.useState(null);
var data=dataState[0];
var setData=dataState[1];

var progState=React.useState(0);
var progress=progState[0];
var setProgress=progState[1];

var statusState=React.useState('Loading...');
var status=statusState[0];
var setStatus=statusState[1];

var errorState=React.useState(null);
var error=errorState[0];
var setError=errorState[1];

var buildState=React.useState({
name:'New Build',
level:1,
theorycraft:false,
skills:[],
armor:{},
weapons:{},
consumables:[],
faction:null,
breakthroughsUsed:0,
controller:{}
});
var build=buildState[0];
var setBuild=buildState[1];

React.useEffect(function(){
try{
var s=localStorage.getItem('outward-build');
if(s)setBuild(JSON.parse(s));
}catch(e){}
},[]);

React.useEffect(function(){
try{
localStorage.setItem('outward-build',JSON.stringify(build));
}catch(e){}
},[build]);

function loadData(){
setError(null);
setStatus('Loading skills...');
setProgress(10);

Promise.all([
fetchJSON('skills/skills_tier1.json'),
fetchJSON('skills/skills_tier2.json'),
fetchJSON('skills/skills_tier3.json'),
fetchJSON('skills/skills_special.json'),
fetchJSON('skills/classes.json')
]).then(function(r){
setProgress(25);
setStatus('Loading weapons...');
return Promise.all([
Promise.resolve(r),
Promise.all([
fetchJSON('weapons/weapons_melee.json'),
fetchJSON('weapons/weapons_ranged.json'),
fetchJSON('weapons/weapons_magical.json'),
fetchJSON('weapons/shields.json')
])
]);
}).then(function(results){
var r=results[0];
var w=results[1];
setProgress(40);
setStatus('Loading armor...');
return Promise.all([
Promise.resolve(r),
Promise.resolve(w),
fetchJSON('armor/armor_items.json')
]);
}).then(function(results){
var r=results[0];
var w=results[1];
var a=results[2];
setProgress(55);
setStatus('Loading items...');
return Promise.all([
Promise.resolve(r),
Promise.resolve(w),
Promise.resolve(a),
fetchJSON('consumables/data.json')
]);
}).then(function(results){
var r=results[0];
var w=results[1];
var a=results[2];
var c=results[3];
setProgress(70);
setStatus('Loading factions...');
return Promise.all([
Promise.resolve(r),
Promise.resolve(w),
Promise.resolve(a),
Promise.resolve(c),
fetchJSON('quests/factions.json')
]);
}).then(function(results){
var r=results[0];
var w=results[1];
var a=results[2];
var c=results[3];
var f=results[4];
setProgress(85);
setStatus('Loading effects...');
return Promise.all([
Promise.resolve(r),
Promise.resolve(w),
Promise.resolve(a),
Promise.resolve(c),
Promise.resolve(f),
fetchJSON('effects/status_effects.json')
]);
}).then(function(results){
var r=results[0];
var w=results[1];
var a=results[2];
var c=results[3];
var f=results[4];
var e=results[5];

setProgress(95);
setStatus('Processing...');

setData({
skills:r[0].concat(r[1],r[2],r[3]),
classes:r[4],
weapons:w[0].weapons.concat(w[1].weapons,w[2].weapons,w[3].weapons),
armor:a,
consumables:c.items||c,
factions:f,
effects:e
});

setProgress(100);
setStatus('Ready!');
setTimeout(function(){setScreen('home')},400);
}).catch(function(e){
setError(e.message||'Failed to load data');
setStatus('Error');
});
}

React.useEffect(function(){loadData()},[]);

if(screen==='loading'){
return LoadingScreen({
progress:progress,
status:status,
error:error,
onRetry:function(){loadData();}
});
}

if(screen==='home'){
return HomeScreen({
data:data,
onStart:function(){setScreen('builder');}
});
}

return BuilderScreen({
data:data,
build:build,
setBuild:setBuild,
onHome:function(){setScreen('home');}
});
}

if(typeof React==='undefined'||typeof ReactDOM==='undefined'){
document.getElementById('root').innerHTML=
'<div style="padding:40px;text-align:center;color:#c9a227;font-family:sans-serif">'+
'<h2>Failed to load React</h2>'+
'<p style="color:#a89878;margin-top:10px">Check your internet connection</p>'+
'<button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;'+
'background:#8b4513;border:1px solid #c9a227;border-radius:6px;color:#e8dcc8;'+
'cursor:pointer">Retry</button></div>';
}else{
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
}
})();
</script>
</body>
</html>
