<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Outward Build Builder</title>
<style>
:root{--bg:#1a1410;--bg2:#241c12;--panel:#2a2118;--panel2:#33291d;--panel3:#3a2f1e;--gold:#c9a227;--gold2:#e8c547;--brown:#8b4513;--text:#e8dcc8;--dim:#a89878;--dim2:#7a6a55;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--purple:#8e44ad;--orange:#e67e22;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{min-height:100vh;min-height:100dvh}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:block}
::-webkit-scrollbar{width:0;height:0}
.loading-screen{background:linear-gradient(160deg,#1a1410,#241c12,#1a1410);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo-svg{width:70px;height:70px;margin-bottom:18px}
.loading-title{font-size:26px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.loading-sub{font-size:11px;color:var(--dim);margin-bottom:32px;font-style:italic}
.loading-bar-wrap{width:200px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--brown);margin:0 auto}
.loading-bar{height:100%;background:linear-gradient(90deg,var(--brown),var(--gold));border-radius:2px;transition:width .3s;width:0%}
.loading-status{margin-top:10px;font-size:10px;color:var(--dim)}
.loading-error{margin-top:14px;padding:9px 12px;background:rgba(192,57,43,.15);border:1px solid var(--red);border-radius:7px;color:#e74c3c;font-size:11px;max-width:260px}
.retry-btn{margin-top:10px;padding:7px 18px;background:var(--brown);border:1px solid var(--gold);border-radius:5px;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit}
#home-screen{background:linear-gradient(180deg,var(--bg),var(--bg2),var(--bg))}
.home-hero{text-align:center;padding:70px 24px 28px;padding-top:calc(70px + var(--sat))}
.home-logo{width:56px;height:56px;margin:0 auto 14px}
.home-title{font-size:28px;color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.home-sub{font-size:12px;color:var(--dim);font-style:italic}
.home-stats{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.home-stat-pill{text-align:center;padding:5px 9px;background:var(--panel);border:1px solid var(--brown);border-radius:7px}
.home-stat-num{font-size:15px;color:var(--gold);font-weight:700}
.home-stat-lbl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.home-menu{max-width:320px;margin:0 auto;padding:12px}
.menu-btn{display:flex;align-items:center;gap:9px;width:100%;padding:12px;margin-bottom:8px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:2px solid var(--brown);border-radius:10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit}
.menu-btn:active{border-color:var(--gold);transform:scale(.98)}
.menu-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:7px;border:1px solid var(--brown);font-size:19px;flex-shrink:0}
.menu-content{flex:1}
.menu-content h3{font-size:13px;color:var(--gold);margin-bottom:2px}
.menu-content p{font-size:10px;color:var(--dim)}
.menu-arrow{color:var(--brown);font-size:15px}
.home-footer{text-align:center;padding:14px;padding-bottom:calc(14px + var(--sab));font-size:9px;color:var(--dim2)}
#builder-screen{background:var(--bg);display:flex;flex-direction:column}
.builder-header{display:flex;align-items:center;gap:4px;padding:6px 8px;padding-top:calc(6px + var(--sat));background:var(--bg2);border-bottom:1px solid var(--brown);position:sticky;top:0;z-index:50}
.header-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--brown);border-radius:5px;cursor:pointer;color:var(--text);font-size:12px;flex-shrink:0}
.header-title{flex:1;font-size:12px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.silver-display{padding:3px 8px;background:var(--panel);border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-size:10px;font-weight:600}
.theory-btn{padding:3px 5px;background:var(--panel);border:1px solid var(--brown);border-radius:4px;color:var(--dim);font-size:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
.theory-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.builder-content{flex:1;padding-bottom:calc(58px + var(--sab))}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(26,20,16,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--brown);padding:2px 0 calc(2px + var(--sab));z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 1px;background:none;border:none;cursor:pointer;color:var(--dim);font-family:inherit;font-size:6px;border-radius:3px}
.tab-btn.active{color:var(--gold);background:rgba(201,162,39,.12)}
.tab-icon{font-size:16px;line-height:1}
.tab-pane{display:none;padding:10px;max-width:500px;margin:0 auto}
.tab-pane.active{display:block}
.sec-card{background:var(--panel);border:1px solid var(--brown);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--brown)}
.sec-icon{font-size:14px}
.sec-title{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.sec-body{padding:4px 12px 8px}
.hero-card{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--brown);border-radius:14px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.hero-card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue))}
.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-stat{text-align:center;padding:10px 4px;background:rgba(0,0,0,.2);border-radius:8px}
.hero-ico{font-size:20px;margin-bottom:4px}
.hero-val{font-size:26px;font-weight:700;line-height:1}
.hero-val.health{color:#e74c3c}.hero-val.stamina{color:#2ecc71}.hero-val.mana{color:#3498db}
.hero-lbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.leyline-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;padding:8px;background:rgba(0,0,0,.15);border-radius:8px}
.leyline-btn{width:36px;height:36px;border-radius:6px;background:var(--panel2);border:1px solid var(--brown);color:var(--text);font-size:18px;cursor:pointer;font-family:inherit}
.leyline-btn:active{background:var(--gold);color:var(--bg)}
.leyline-val{font-size:14px;font-weight:700;min-width:50px;text-align:center}
.leyline-val.health{color:#e74c3c}.leyline-val.mana{color:#3498db}
.pts-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pts-card{background:var(--panel);border:1px solid var(--brown);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px}
.pts-ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:6px;font-size:16px;flex-shrink:0}
.pts-info h4{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.pts-val{font-size:14px;color:var(--gold);font-weight:700}
.pts-val.warn{color:var(--red)}
.inventory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0}
.inv-slot{aspect-ratio:1;background:var(--panel2);border:2px dashed var(--brown);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;text-align:center;position:relative;min-height:70px}
.inv-slot.filled{border-style:solid;border-color:var(--gold)}
.inv-slot img{width:36px;height:48px;object-fit:cover;border-radius:4px;margin-bottom:2px}
.inv-slot.weapon img{width:40px;height:52px}
.inv-lbl{font-size:7px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.inv-item{font-size:8px;margin-top:2px;line-height:1.2;max-height:20px;overflow:hidden}
.quick-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0}
.quick-slot{aspect-ratio:1;background:var(--panel2);border:2px solid var(--blue);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;min-height:60px}
.quick-slot img{width:32px;height:40px;object-fit:cover;border-radius:3px}
.resist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px 0}
.resist-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--panel2);border-radius:6px}
.resist-lbl{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}
.resist-val{font-size:12px;font-weight:700;color:var(--gold)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(139,69,19,.2);font-size:12px}
.srow:last-child{border-bottom:none}
.sname{color:var(--text);display:flex;align-items:center;gap:5px}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdot.physical{background:#95a5a6}.sdot.fire{background:#e74c3c}.sdot.frost{background:#3498db}.sdot.lightning{background:#f1c40f}.sdot.decay{background:#2ecc71}.sdot.ethereal{background:#9b59b6}.sdot.impact{background:#e67e22}
.sval{color:var(--gold);font-weight:600;font-size:13px}
.sval.pos{color:var(--green)}.sval.neg{color:var(--red)}
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 0}
@media(min-width:700px){.item-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.item-grid{grid-template-columns:repeat(4,1fr)}}
.item-card{background:var(--panel2);border:1px solid var(--brown);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:220px}
.item-card.selected{border-color:var(--gold);background:var(--panel3)}
.item-card.rarity-unique{border-color:var(--gold)}
.item-card.rarity-crafted{border-color:var(--blue)}
.item-card.rarity-legacy{border-color:var(--purple)}
.item-card.rarity-set{border-color:var(--green)}
.item-card.rarity-quest{border-color:var(--orange)}
.item-header{display:flex;gap:12px;align-items:flex-start}
.item-icon{width:48px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--bg)}
.item-title{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:600;line-height:1.3}
.item-type{font-size:10px;color:var(--dim);margin-top:2px}
.item-stats{display:flex;flex-direction:column;gap:4px;font-size:12px}
.stat-line{display:flex;justify-content:space-between;padding:2px 0}
.stat-label{color:var(--dim)}
.stat-value{color:var(--gold);font-weight:600}
.item-desc{font-size:11px;color:var(--dim);line-height:1.5;margin-top:4px}
.item-set{font-size:10px;color:var(--gold);margin-top:4px}
.effects-section{margin-top:8px;padding:8px;background:rgba(192,57,43,.25);border-radius:6px;border:none}
.effects-title{font-size:10px;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.effect-tags{display:flex;flex-wrap:wrap;gap:6px}
.effect-tag{display:inline-flex;align-items:center;gap:5px;background:transparent;color:#fff;padding:3px 8px;font-size:11px;font-weight:500}
.effect-tag img{width:18px;height:18px;object-fit:contain;border-radius:3px}
.craft-section{margin-top:8px;padding:8px;background:rgba(39,174,96,.1);border-radius:6px;border:1px solid rgba(39,174,96,.3)}
.craft-title{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.craft-ing{font-size:11px;color:var(--text);padding:2px 0}
.craft-station{font-size:10px;color:var(--dim);margin-top:4px}
.source-section{margin-top:8px;padding:8px;background:rgba(169,152,120,.1);border-radius:6px}
.source-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.source-text{font-size:11px;color:var(--text);margin-top:4px}
.legacy-section{margin-top:8px;padding:8px;background:rgba(142,68,173,.1);border-radius:6px;border:1px solid rgba(142,68,173,.3)}
.legacy-title{font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.legacy-path{font-size:11px;color:var(--text);padding:2px 0}
.item-actions{margin-top:auto;padding-top:8px}
.equip-btn{width:100%;padding:12px;background:var(--brown);border:1px solid var(--gold);border-radius:6px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;min-height:44px}
.equip-btn:hover{background:var(--gold);color:var(--bg)}
.equip-btn.equipped{background:var(--gold);color:var(--bg)}
.search-bar{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--brown);border-radius:8px;color:var(--text);font-size:16px;font-family:inherit;margin-bottom:8px}
.filter-section{margin-bottom:10px}
.filter-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:6px 10px;background:var(--panel);border:1px solid var(--brown);border-radius:14px;cursor:pointer;font-size:10px;color:var(--dim);font-family:inherit}
.pill.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.sort-select{width:100%;padding:8px;background:var(--panel);border:1px solid var(--brown);border-radius:6px;color:var(--text);font-size:12px;font-family:inherit;margin-bottom:8px}
.class-section{margin-bottom:16px}
.class-header{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--brown);border-radius:8px;margin-bottom:6px}
.class-icon{width:36px;height:48px;object-fit:cover;border-radius:4px}
.class-info h3{font-size:14px;color:var(--gold)}
.class-info p{font-size:10px;color:var(--dim)}
.tier-section{margin-bottom:8px}
.tier-label{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;padding:6px 0;border-bottom:1px solid var(--brown);margin-bottom:4px}
.skill-item{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-top:4px;background:var(--panel2);border:1px solid transparent;border-radius:8px;cursor:pointer;min-height:80px}
.skill-item.selected{border-color:var(--gold);background:var(--panel3)}
.skill-item.locked{opacity:.5}
.skill-item.breakthrough{border-color:var(--gold);background:rgba(201,162,39,.1)}
.skill-item img{width:40px;height:52px;object-fit:cover;border-radius:4px;flex-shrink:0}
.skill-info{flex:1;min-width:0}
.skill-name{font-size:13px;font-weight:600}
.skill-meta{font-size:10px;color:var(--dim);margin-top:2px}
.skill-req{font-size:9px;color:var(--orange);margin-top:2px}
.skill-excl{font-size:9px;color:var(--red);margin-top:2px}
.skill-cost{font-size:11px;color:var(--gold);font-weight:600;margin-top:4px}
.skill-desc{font-size:11px;color:var(--text);line-height:1.4;margin-top:6px;padding-top:6px;border-top:1px solid rgba(139,69,19,.2)}
.skill-tier-badge{padding:3px 6px;background:var(--brown);color:var(--gold);font-size:8px;border-radius:3px;flex-shrink:0}
.skill-tier-badge.t2{background:var(--gold);color:var(--bg);font-weight:700}
.skill-tier-badge.t3{background:#7d6608;color:#fff}
.faction-card{background:var(--panel2);border:1px solid var(--brown);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.faction-card.selected{border-color:var(--gold);background:var(--panel3)}
.faction-name{font-size:16px;color:var(--gold);font-weight:700;margin-bottom:4px}
.faction-desc{font-size:12px;color:var(--dim);line-height:1.5}
.quest-item{background:var(--panel2);border:1px solid var(--brown);border-radius:10px;padding:12px;margin-bottom:8px}
.quest-name{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:4px}
.quest-desc{font-size:11px;color:var(--dim);line-height:1.4;margin-bottom:8px}
.reward-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
@media(min-width:600px){.reward-cards{grid-template-columns:repeat(3,1fr)}}
.reward-card{background:var(--panel);border:1px solid var(--brown);border-radius:8px;padding:10px;cursor:pointer;text-align:center;transition:all .2s;position:relative}
.reward-card:hover{border-color:var(--gold)}
.reward-card.selected{border-color:var(--gold);background:var(--panel3);box-shadow:0 0 10px rgba(201,162,39,.3)}
.reward-card img{width:40px;height:52px;object-fit:cover;border-radius:4px;margin-bottom:6px}
.reward-card-name{font-size:11px;font-weight:600;line-height:1.2}
.reward-card-type{font-size:9px;color:var(--dim);margin-top:2px}
.reward-card-desc{font-size:9px;color:var(--dim);margin-top:4px;line-height:1.3}
.reward-check{position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:12px;font-weight:700}
.locks-warning{font-size:10px;color:var(--red);margin-top:6px;padding:4px 8px;background:rgba(192,57,43,.1);border-radius:4px}
.total-rewards{margin-top:16px;padding:12px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;text-align:center}
.total-rewards-title{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.total-rewards-value{font-size:14px;color:var(--text);margin-top:4px}
.cons-item{display:flex;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--brown);border-radius:10px;margin-bottom:8px;cursor:pointer}
.cons-item.selected{border-color:var(--gold);background:var(--panel3)}
.cons-item img{width:44px;height:56px;object-fit:cover;border-radius:4px;flex-shrink:0}
.cons-info{flex:1;min-width:0}
.cons-name{font-size:14px;font-weight:600}
.cons-type{font-size:10px;color:var(--dim);margin-top:2px}
.cons-desc{font-size:11px;color:var(--dim);line-height:1.4;margin-top:4px}
.effect-item{display:flex;gap:12px;padding:14px;background:var(--panel2);border:1px solid var(--brown);border-radius:10px;margin-bottom:8px}
.effect-item img{width:48px;height:48px;object-fit:contain;border-radius:50%;flex-shrink:0}
.effect-info{flex:1}
.effect-name{font-size:14px;color:var(--gold);font-weight:600}
.effect-desc{font-size:12px;color:var(--dim);line-height:1.4;margin-top:4px}
.effect-stats{font-size:11px;color:var(--text);margin-top:4px}
.effect-cat{font-size:9px;padding:2px 6px;background:var(--brown);color:var(--gold);border-radius:3px;text-transform:uppercase;display:inline-block;margin-top:4px}
.chip-row{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:var(--panel2);border-radius:4px;font-size:10px}
.chip img{width:16px;height:20px;object-fit:cover;border-radius:2px}
.chip-empty{color:var(--dim2);font-size:11px;padding:8px 0;text-align:center;font-style:italic}
@media(min-width:900px){.home-menu{max-width:340px}.builder-content{display:grid;grid-template-columns:280px 1fr 320px;gap:0;padding-bottom:0}.tab-pane{display:block!important;border-right:1px solid var(--brown);max-width:none}.tab-bar{display:none}}
@media(max-width:380px){.home-title{font-size:20px;letter-spacing:3px}.hero-val{font-size:20px}.item-grid{grid-template-columns:1fr}.inventory-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div id="loading-screen" class="screen active">

<script>
var DATA=null;
var BUILD={name:'New Build',theorycraft:false,skills:[],armor:{},weapons:{},consumables:[],faction:null,breakthroughsUsed:0,leylines:{health:100,mana:20},quickSlots:[null,null,null,null]};
var CURRENT_TAB='stats';
var ARMOR_FILTER={slot:'all',rarity:'all',sort:'name'};
var WEAPON_FILTER={type:'all',hand:'all',dmg:'all',effect:'all',sort:'name'};
var SKILL_SEARCH='';
var SKILL_CLASS_FILTER=null;
var CONS_SEARCH='';
var CONS_TYPE_FILTER=null;
var EFFECT_SEARCH='';
var QUEST_SELECTIONS={};
var ARMOR_SEARCH='';
var WEAPON_SEARCH='';

function setProgress(pct,status){
  var bar=document.getElementById('loading-bar');
  var txt=document.getElementById('loading-status');
  if(bar)bar.style.width=pct+'%';
  if(txt)txt.textContent=status;
}

function showError(msg){
  var err=document.getElementById('loading-error');
  var btn=document.getElementById('retry-btn');
  if(err){err.textContent=msg;err.style.display='block';}
  if(btn)btn.style.display='block';
}

function hideError(){
  var err=document.getElementById('loading-error');
  var btn=document.getElementById('retry-btn');
  if(err)err.style.display='none';
  if(btn)btn.style.display='none';
}

function fetchJSON(path){
  return fetch('data/raw/'+path).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status+': '+path);
    return r.json();
  });
}

function makeClick(fn,arg){
  return 'data-fn="'+fn+'" data-arg="'+encodeURIComponent(arg)+'" onclick="handleClick(event)"';
}

function handleClick(e){
  var el=e.target.closest('[data-fn]');
  if(!el)return;
  var fn=el.getAttribute('data-fn');
  var arg=decodeURIComponent(el.getAttribute('data-arg')||'');
  e.stopPropagation();
  if(fn==='equipArmor')equipArmor(arg);
  else if(fn==='unequipArmor')unequipArmor(arg);
  else if(fn==='equipWeapon')equipWeapon(arg);
  else if(fn==='unequipWeapon')unequipWeapon(arg);
  else if(fn==='toggleSkill')toggleSkill(arg);
  else if(fn==='selectFaction')selectFaction(arg);
  else if(fn==='selectOutcome'){var p=arg.split('|');selectOutcome(p[0],p[1]);}
  else if(fn==='toggleCons')toggleCons(arg);
  else if(fn==='switchTab')switchTab(arg);
  else if(fn==='setArmorFilter'){var p=arg.split('|');setArmorFilter(p[0],p[1]);}
  else if(fn==='setWeaponFilter'){var p=arg.split('|');setWeaponFilter(p[0],p[1]);}
  else if(fn==='filterClass')filterSkillsByClass(arg==='null'?null:arg);
  else if(fn==='filterCons')filterConsByType(arg==='null'?null:arg);
}

function getItemImage(item,type){
  if(!item)return null;
  var path=item.local_image||item.image_local||item.image;
  if(path)return path;
  var name=item.name.replace(/[^a-zA-Z0-9]/g,'_');
  if(type==='armor')return 'assets/images/armor/armor_'+name+'.png';
  if(type==='weapon')return 'assets/images/weapons/weapon_'+name+'.png';
  if(type==='skill')return 'assets/images/skills/skill_'+name+'.png';
  if(type==='consumable')return 'assets/images/consumables/'+name+'.png';
  if(type==='effect'){
    var base=item.name.replace(/[^a-zA-Z0-9]/g,'_');
    while(base.indexOf('__')>=0){base=base.replace(/__/g,'_');}
    base=base.replace(/_+$/,'');
    if(item.name.charAt(item.name.length-1)===')'){base+='_';}
    return 'assets/images/effects/effect_'+base+'.png';
  }
  return null;
}

function imgHtml(src,cls){
  cls=cls||'item-icon';
  if(!src){
    return '<div class="'+cls+'" style="background:var(--panel3);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px;min-width:48px;min-height:64px;">?</div>';
  }
  return '<img class="'+cls+'" src="'+escHtml(src)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;'+cls+'&quot; style=&quot;background:var(--panel3);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px;min-width:48px;min-height:64px;&quot;>?</div>\'">';
}

function escHtml(s){
  if(!s)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cleanDesc(text){
  if(!text)return '';
  text=String(text);
  // Remove HTML tags including unclosed
  text=text.replace(/<[^>]*>?/g,'');
  // Remove JavaScript keywords
  text=text.replace(/\b(function|var|let|const|return|if|else|for|while|new|typeof)\b/gi,'');
  // Remove JSON objects
  text=text.replace(/\{[^}]*\}/g,'');
  // Remove CSS properties
  text=text.replace(/\w+\s*:\s*[^;{}]+;?/g,'');
  // Remove file references
  text=text.replace(/\S+\.(png|jpg|jpeg|gif|svg|json|html|css|js|ts|tsx|jsx)/gi,'');
  // Remove URLs
  text=text.replace(/https?:\/\/\S+/g,'');
  // Remove wiki domain references
  text=text.replace(/outward\.wiki\.gg\S*/g,'');
  // Remove File: references
  text=text.replace(/File:[^\s|]+/g,'');
  // Remove wiki brackets
  text=text.replace(/\[\[|\]\]/g,'');
  // Remove wiki template artifacts: everything from }} to end
  text=text.replace(/\s*\}\}.*$/g,'');
  // Remove pipe-separated key-value pairs at end
  text=text.replace(/\s*\|\s*\w+\s*=.*$/g,'');
  // Remove trailing {{ or }}
  text=text.replace(/\s*\{\{\s*$/g,'');
  // Remove object id
  text=text.replace(/object\s+id\s*=\s*\d+/gi,'');
  // Clean up extra whitespace
  text=text.replace(/\s+/g,' ').trim();
  // Remove leading/trailing punctuation artifacts
  text=text.replace(/^[\s,;:|\-]+|[\s,;:|\-]+$/g,'');
  return text;
}function loadData(){
  hideError();
  setProgress(5,'Loading skills...');
  Promise.all([fetchJSON('skills/skills_tier1.json'),fetchJSON('skills/skills_tier2.json'),fetchJSON('skills/skills_tier3.json'),fetchJSON('skills/skills_special.json'),fetchJSON('skills/classes.json')]).then(function(r){
    setProgress(20,'Loading weapons...');
    return Promise.all([Promise.resolve(r),Promise.all([fetchJSON('weapons/weapons_melee.json'),fetchJSON('weapons/weapons_ranged.json'),fetchJSON('weapons/weapons_magical.json'),fetchJSON('weapons/shields.json')])]);
  }).then(function(results){
    var r=results[0];var w=results[1];
    setProgress(35,'Loading armor...');
    return Promise.all([Promise.resolve(r),Promise.resolve(w),fetchJSON('armor/armor_items.json'),fetchJSON('armor/armor_sets.json')]);
  }).then(function(results){
    var r=results[0];var w=results[1];var a=results[2];var sets=results[3];
    setProgress(50,'Loading items...');
    return Promise.all([Promise.resolve(r),Promise.resolve(w),Promise.resolve(a),Promise.resolve(sets),fetchJSON('consumables/data.json')]);
  }).then(function(results){
    var r=results[0];var w=results[1];var a=results[2];var sets=results[3];var c=results[4];
    setProgress(65,'Loading factions...');
    return Promise.all([Promise.resolve(r),Promise.resolve(w),Promise.resolve(a),Promise.resolve(sets),Promise.resolve(c),fetchJSON('quests/factions.json'),fetchJSON('quests/quests.json'),fetchJSON('quests/exclusivity_map.json')]);
  }).then(function(results){
    var r=results[0];var w=results[1];var a=results[2];var sets=results[3];var c=results[4];var f=results[5];var q=results[6];var em=results[7];
    setProgress(85,'Loading effects...');
    return Promise.all([Promise.resolve(r),Promise.resolve(w),Promise.resolve(a),Promise.resolve(sets),Promise.resolve(c),Promise.resolve(f),Promise.resolve(q),Promise.resolve(em),fetchJSON('effects/status_effects.json')]);
  }).then(function(results){
    var r=results[0];var w=results[1];var a=results[2];var sets=results[3];var c=results[4];var f=results[5];var q=results[6];var em=results[7];var e=results[8];
    DATA={skills:r[0].concat(r[1],r[2],r[3]),classes:r[4],weapons:w[0].weapons.concat(w[1].weapons,w[2].weapons,w[3].weapons),armor:a,armorSets:sets,consumables:c.items||c,factions:f,quests:q,exclusivityMap:em,effects:e};
    setProgress(100,'Ready!');
    try{localStorage.removeItem('outward-build');}catch(e){}
    setTimeout(function(){showScreen('home-screen');renderHome();},300);
  }).catch(function(e){
    showError(e.message||'Failed to load data');
    setProgress(0,'Error');
  });
}

function showScreen(id){
  var screens=document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++){screens[i].classList.remove('active');}
  var el=document.getElementById(id);
  if(el)el.classList.add('active');
}

function renderHome(){
  var stats=document.getElementById('home-stats');
  if(!stats||!DATA)return;
  stats.innerHTML='<div class="home-stat-pill"><div class="home-stat-num">'+DATA.skills.length+'</div><div class="home-stat-lbl">Skills</div></div><div class="home-stat-pill"><div class="home-stat-num">'+DATA.weapons.length+'</div><div class="home-stat-lbl">Weapons</div></div><div class="home-stat-pill"><div class="home-stat-num">'+DATA.armor.length+'</div><div class="home-stat-lbl">Armor</div></div><div class="home-stat-pill"><div class="home-stat-num">'+DATA.consumables.length+'</div><div class="home-stat-lbl">Items</div></div>';
}

function renderBuilder(){
  if(!DATA)return;
  document.getElementById('build-name').textContent=BUILD.name||'New Build';
  document.getElementById('theory-btn').className='theory-btn'+(BUILD.theorycraft?' active':'');
  document.getElementById('silver-display').textContent=calculateTotalCost()+'s';
  var tabs=[{id:'stats',icon:'\uD83D\uDCCA',label:'Stats'},{id:'armor',icon:'\uD83D\uDEE1\uFE0F',label:'Armor'},{id:'weapons',icon:'\u2694\uFE0F',label:'Weapons'},{id:'skills',icon:'\u26A1',label:'Skills'},{id:'factions',icon:'\uD83C\uDFF0',label:'Factions'},{id:'consumables',icon:'\uD83E\uDDEA',label:'Items'},{id:'effects',icon:'\uD83D\uDCD6',label:'Effects'}];
  var tabBar=document.getElementById('tab-bar');
  tabBar.innerHTML='';
  for(var i=0;i<tabs.length;i++){
    var btn=document.createElement('button');
    btn.className='tab-btn'+(CURRENT_TAB===tabs[i].id?' active':'');
    btn.innerHTML='<span class="tab-icon">'+tabs[i].icon+'</span><span>'+tabs[i].label+'</span>';
    btn.onclick=(function(tabId){return function(){switchTab(tabId);};})(tabs[i].id);
    tabBar.appendChild(btn);
  }
  renderTab(CURRENT_TAB);
}

function calculateTotalCost(){
  var total=0;
  (BUILD.skills||[]).forEach(function(name){
    var s=findSkill(name);
    if(s&&s.cost){var cost=parseInt(String(s.cost).replace(/[^0-9]/g,''))||0;total+=cost;}
  });
  return total;
}

function switchTab(tabId){
  CURRENT_TAB=tabId;
  var btns=document.querySelectorAll('.tab-btn');
  var tabs=['stats','armor','weapons','skills','factions','consumables','effects'];
  for(var i=0;i<btns.length;i++){btns[i].className='tab-btn'+(tabs[i]===tabId?' active':'');}
  renderTab(tabId);
}

function renderTab(tabId){
  var pane=document.getElementById('pane-'+tabId);
  if(!pane)return;
  var panes=document.querySelectorAll('.tab-pane');
  for(var i=0;i<panes.length;i++){panes[i].classList.remove('active');}
  pane.classList.add('active');
  if(tabId==='stats')renderStatsTab(pane);
  else if(tabId==='armor')renderArmorTab(pane);
  else if(tabId==='weapons')renderWeaponsTab(pane);
  else if(tabId==='skills')renderSkillsTab(pane);
  else if(tabId==='factions')renderFactionsTab(pane);
  else if(tabId==='consumables')renderConsumablesTab(pane);
  else if(tabId==='effects')renderEffectsTab(pane);
}

function findArmor(name){for(var i=0;i<DATA.armor.length;i++){if(DATA.armor[i].name===name)return DATA.armor[i];}return null;}
function findWeapon(name){for(var i=0;i<DATA.weapons.length;i++){if(DATA.weapons[i].name===name)return DATA.weapons[i];}return null;}
function findSkill(name){for(var i=0;i<DATA.skills.length;i++){if(DATA.skills[i].name===name)return DATA.skills[i];}return null;}
function findConsumable(name){for(var i=0;i<DATA.consumables.length;i++){if(DATA.consumables[i].name===name)return DATA.consumables[i];}return null;}

function calculateStats(){
  var r={health:BUILD.leylines?BUILD.leylines.health:100,stamina:100,mana:BUILD.leylines?BUILD.leylines.mana:20,protection:0,impactResist:0,resistances:{physical:0,fire:0,frost:0,lightning:0,decay:0,ethereal:0},staminaCost:0,manaCost:0,moveSpeed:0,coldResist:0,heatResist:0,pouch:0};
  Object.keys(BUILD.armor||{}).forEach(function(slot){
    var name=BUILD.armor[slot];if(!name)return;
    var a=findArmor(name);
    if(a){
      r.protection+=a.protection||0;
      r.impactResist+=(a.resistances&&a.resistances.impact)||0;
      r.staminaCost+=a.stamina_cost_reduction||0;
      r.manaCost+=a.mana_cost_reduction||0;
      r.moveSpeed+=a.move_speed||0;
      r.coldResist+=a.cold_resist||0;
      r.heatResist+=a.heat_resist||0;
      r.pouch+=a.pouch||0;
      if(a.resistances){['physical','fire','frost','lightning','decay','ethereal'].forEach(function(k){if(a.resistances[k])r.resistances[k]=(r.resistances[k]||0)+a.resistances[k];});}
    }
  });
  ['weapon_main','weapon_off'].forEach(function(slot){
    var name=BUILD.weapons&&BUILD.weapons[slot];if(!name)return;
    var w=findWeapon(name);
    if(w&&w.damage_stats&&w.damage_stats.base_damage){
      Object.keys(w.damage_stats.base_damage).forEach(function(k){
        var v=w.damage_stats.base_damage[k];
        if(k==='impact')r.impactResist+=v;
        else r.resistances[k]=(r.resistances[k]||0)+v;
      });
    }
  });
  (BUILD.skills||[]).forEach(function(name){
    var s=findSkill(name);
    if(s&&s.effects){
      var m=s.effects.match(/([+-])([0-9]+)\s*(health|stamina|mana)/i);
      if(m){var key=m[3].toLowerCase();r[key]+=parseInt(m[2])*(m[1]==='-'?-1:1);}
    }
  });
  return r;
}

function adjustLeyline(stat,amount){
  if(!BUILD.leylines)BUILD.leylines={health:100,mana:20};
  var h=BUILD.leylines.health;var m=BUILD.leylines.mana;
  if(stat==='health'){
    var newH=h+amount;var newM=m-amount;
    if(newH>=25&&newH<=200&&newM>=0&&newM<=100){BUILD.leylines.health=newH;BUILD.leylines.mana=newM;}
  }else{
    var newM2=m+amount;var newH2=h-amount;
    if(newM2>=0&&newM2<=100&&newH2>=25&&newH2<=200){BUILD.leylines.mana=newM2;BUILD.leylines.health=newH2;}
  }
  saveBuild();renderTab('stats');renderBuilder();
}

function statRow(lbl,val,opts){
  opts=opts||{};
  var cls='sval';
  if(val>0&&!opts.noPlus)cls+=' pos';
  if(val<0)cls+=' neg';
  var d=(val>0&&!opts.noPlus?'+':'')+val+(opts.suffix||'');
  var dot=opts.dot?'<span class="sdot '+opts.dot+'"></span>':'';
  return '<div class="srow"><span class="sname">'+dot+lbl+'</span><span class="'+cls+'">'+d+'</span></div>';
}

function resistItem(dot,lbl,val){
  return '<div class="resist-item"><span class="resist-lbl"><span class="sdot '+dot+'"></span>'+lbl+'</span><span class="resist-val">'+val+'</span></div>';
}

function chipHtml(item){
  var imgPath=getItemImage(item,'skill');
  var img=imgPath?'<img src="'+escHtml(imgPath)+'" loading="lazy" onerror="this.style.display=\'none\'">':'';
  return '<span class="chip">'+img+escHtml(item.name)+'</span>';
}

function renderStatsTab(pane){
  var stats=calculateStats();
  var btLeft=3-(BUILD.breakthroughsUsed||0);
  var totalCost=calculateTotalCost();
  var html='';
  html+='<div class="hero-card"><div class="hero-grid">';
  html+='<div class="hero-stat"><div class="hero-ico">\u2764\uFE0F</div><div class="hero-val health">'+stats.health+'</div><div class="hero-lbl">Health</div></div>';
  html+='<div class="hero-stat"><div class="hero-ico">\u26A1</div><div class="hero-val stamina">'+stats.stamina+'</div><div class="hero-lbl">Stamina</div></div>';
  html+='<div class="hero-stat"><div class="hero-ico">\uD83D\uDD2E</div><div class="hero-val mana">'+stats.mana+'</div><div class="hero-lbl">Mana</div></div>';
  html+='</div>';
  html+='<div class="leyline-controls">';
  html+='<button class="leyline-btn" onclick="adjustLeyline(\'health\',-5)">-</button>';
  html+='<span class="leyline-val health">'+BUILD.leylines.health+' HP</span>';
  html+='<button class="leyline-btn" onclick="adjustLeyline(\'health\',5)">+</button>';
  html+='<span style="color:var(--dim);font-size:12px;margin:0 8px">\u2194</span>';
  html+='<button class="leyline-btn" onclick="adjustLeyline(\'mana\',-5)">-</button>';
  html+='<span class="leyline-val mana">'+BUILD.leylines.mana+' MP</span>';
  html+='<button class="leyline-btn" onclick="adjustLeyline(\'mana\',5)">+</button>';
  html+='</div></div>';
  html+='<div class="pts-row">';
  html+='<div class="pts-card"><div class="pts-ico">\uD83D\uDCB0</div><div class="pts-info"><h4>Total Cost</h4><div class="pts-val">'+totalCost+'s</div></div></div>';
  html+='<div class="pts-card"><div class="pts-ico">\uD83D\uDCAB</div><div class="pts-info"><h4>Breakthroughs</h4><div class="pts-val'+(btLeft<=0?' warn':'')+'">'+(BUILD.breakthroughsUsed||0)+' / 3</div></div></div>';
  html+='</div>';
  html+='<div class="sec-card"><div class="sec-hdr"><span class="sec-icon">\uD83C\uDF92</span><span class="sec-title">Equipment</span></div><div class="sec-body">';
  html+='<div class="inventory-grid">';
  var armorSlots=[{id:'head',label:'Head'},{id:'chest',label:'Chest'},{id:'legs',label:'Legs'},{id:'boots',label:'Boots'}];
  for(var i=0;i<armorSlots.length;i++){
    var slot=armorSlots[i];
    var itemName=(BUILD.armor||{})[slot.id];

function findUpgradedFromArmor(itemName){
  for(var i=0;i<DATA.armor.length;i++){
    var a=DATA.armor[i];
    if(a.blacksmith_upgrade){
      var upgradeResult=a.blacksmith_upgrade;
      if(upgradeResult.toLowerCase().indexOf(itemName.toLowerCase())>=0){return a.name;}
    }
  }
  return null;
}

function findUpgradedFromWeapon(itemName){
  for(var i=0;i<DATA.weapons.length;i++){
    var w=DATA.weapons[i];
    if(w.upgrade_paths){
      for(var j=0;j<w.upgrade_paths.length;j++){
        var up=w.upgrade_paths[j];
        var result=up.result||up.to||'';
        if(result.toLowerCase().indexOf(itemName.toLowerCase())>=0){return w.name;}
      }
    }
  }
  return null;
}

function getArmorRarityClass(a){
  var desc=(a.description||'').toLowerCase();
  if(a.crafting_recipe&&a.crafting_recipe.length>0)return 'rarity-crafted';
  if(a.blacksmith_upgrade)return 'rarity-legacy';
  if(desc.indexOf('unique')>=0)return 'rarity-unique';
  if(desc.indexOf('quest')>=0)return 'rarity-quest';
  return 'rarity-common';
}

function getArmorRarityName(a){
  var desc=(a.description||'').toLowerCase();
  if(a.crafting_recipe&&a.crafting_recipe.length>0)return 'Crafted';
  if(a.blacksmith_upgrade)return 'Legacy';
  if(desc.indexOf('unique')>=0)return 'Unique';
  if(desc.indexOf('quest')>=0)return 'Quest';
  return 'Common';
}

function renderArmorList(){
  var container=document.getElementById('armor-list');
  if(!container)return;
  var filtered=DATA.armor.filter(function(a){
    if(ARMOR_FILTER.slot!=='all'&&a.slot!==ARMOR_FILTER.slot)return false;
    if(ARMOR_FILTER.rarity!=='all'){var rClass=getArmorRarityName(a);if(rClass!==ARMOR_FILTER.rarity)return false;}
    if(ARMOR_SEARCH){var q=ARMOR_SEARCH.toLowerCase();if(a.name.toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
  if(ARMOR_FILTER.sort==='protection-desc'){filtered.sort(function(a,b){return (b.protection||0)-(a.protection||0);});}
  else if(ARMOR_FILTER.sort==='protection-asc'){filtered.sort(function(a,b){return (a.protection||0)-(b.protection||0);});}
  else if(ARMOR_FILTER.sort==='weight'){filtered.sort(function(a,b){return (a.weight||0)-(b.weight||0);});}
  else{filtered.sort(function(a,b){return a.name.localeCompare(b.name);});}
  var html='<div class="item-grid">';

    var a=filtered[i];

    html+='<div class="item-type">'+escHtml(a.slot||'')+' | '+rarityName+'</div>';
    html+='</div></div>';
    html+='<div class="item-stats">';
    html+='<div class="stat-line"><span class="stat-label">Protection</span><span class="stat-value">'+(a.protection||0)+'</span></div>';
    if(a.resistances){['physical','fire','frost','lightning','decay','ethereal'].forEach(function(k){var v=a.resistances[k]||0;if(v>0){html+='<div class="stat-line"><span class="stat-label">'+k.charAt(0).toUpperCase()+k.slice(1)+'</span><span class="stat-value">'+v+'</span></div>';}});if(a.resistances.impact){html+='<div class="stat-line"><span class="stat-label">Impact</span><span class="stat-value">'+a.resistances.impact+'</span></div>';}}

      html+='<div class="craft-section">';
      html+='<div class="craft-title">\uD83D\uDD28 Crafting Recipe:</div>';

      html+='</div>';
    }else if(a.source){
      html+='<div class="source-section">';
      html+='<div class="source-title">\uD83D\uDCE6 Source:</div>';
      html+='<div class="source-text">'+escHtml(a.source)+'</div>';

function equipArmor(name){

  if(!a)return;
  if(!BUILD.armor)BUILD.armor={};
  BUILD.armor[a.slot]=name;
  saveBuild();renderArmorList();renderBuilder();
}

function unequipArmor(name){
  var a=findArmor(name);
  if(!a)return;
  if(BUILD.armor&&BUILD.armor[a.slot]===name){
    delete BUILD.armor[a.slot];
    saveBuild();renderArmorList();renderBuilder();
  }
}

function findEffectByName(name){
  if(!DATA.effects)return null;
  for(var i=0;i<DATA.effects.length;i++){
    var e=DATA.effects[i];
    if(e.name&&e.name.toLowerCase()===name.toLowerCase())return e;
    if(e.name&&name.toLowerCase().indexOf(e.name.toLowerCase())>=0)return e;
    if(e.name&&e.name.toLowerCase().indexOf(name.toLowerCase())>=0)return e;
  }
  return null;
}

function getEffectImage(effect){
  if(!effect)return null;
  if(effect.icon_local)return effect.icon_local;
  // Generate filename matching the actual file naming convention
  var base=effect.name.replace(/[^a-zA-Z0-9]/g,'_');
  while(base.indexOf('__')>=0){base=base.replace(/__/g,'_');}
  base=base.replace(/_+$/,'');
  if(effect.name.charAt(effect.name.length-1)===')'){base+='_';}
  return 'assets/images/effects/effect_'+base+'.png';
}

function renderWeaponList(){
  var container=document.getElementById('weapon-list');
  if(!container)return;
  var filtered=DATA.weapons.filter(function(w){
    if(WEAPON_FILTER.type!=='all'&&(w.weapon_type||'').toLowerCase()!==WEAPON_FILTER.type.toLowerCase())return false;
    if(WEAPON_FILTER.hand!=='all'){
      var hand=w.handedness||'';
      var filterHand=WEAPON_FILTER.hand;
      if(filterHand==='1H'&&(hand!=='one_handed'&&hand!=='1H'))return false;
      if(filterHand==='2H'&&(hand!=='two_handed'&&hand!=='2H'))return false;
    }
    if(WEAPON_FILTER.dmg!=='all'){
      var hasDmg=false;
      if(w.damage_stats&&w.damage_stats.base_damage){if(w.damage_stats.base_damage[WEAPON_FILTER.dmg]>0)hasDmg=true;}
      if(!hasDmg)return false;
    }
    if(WEAPON_FILTER.effect!=='all'){
      var hasEffect=false;
      if(w.special_effects&&w.special_effects.length>0){
        w.special_effects.forEach(function(fx){if(fx.toLowerCase().indexOf(WEAPON_FILTER.effect.toLowerCase())>=0)hasEffect=true;});
      }
      if(!hasEffect)return false;
    }
    if(WEAPON_SEARCH){var q=WEAPON_SEARCH.toLowerCase();if(w.name.toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
  if(WEAPON_FILTER.sort==='damage'){
    filtered.sort(function(a,b){
      var dmgA=a.damage_stats&&a.damage_stats.base_damage?Object.values(a.damage_stats.base_damage).reduce(function(x,y){return x+y;},0):0;
      var dmgB=b.damage_stats&&b.damage_stats.base_damage?Object.values(b.damage_stats.base_damage).reduce(function(x,y){return x+y;},0):0;
      return dmgB-dmgA;
    });
  }else if(WEAPON_FILTER.sort==='speed'){
    filtered.sort(function(a,b){return (b.damage_stats&&b.damage_stats.attack_speed||0)-(a.damage_stats&&a.damage_stats.attack_speed||0);});
  }else if(WEAPON_FILTER.sort==='weight'){
    filtered.sort(function(a,b){return (a.weight||0)-(b.weight||0);});
  }else{
    filtered.sort(function(a,b){return a.name.localeCompare(b.name);});
  }
  var html='<div class="item-grid">';
  for(var i=0;i<filtered.length;i++){
    var w=filtered[i];
    var rarityClass=getWeaponRarityClass(w);
    var rarityName=getWeaponRarityName(w);
    var isEquipped=Object.values(BUILD.weapons||{}).indexOf(w.name)>=0;
    var imgPath=getItemImage(w,'weapon');

    html+='<div class="item-header">';
    html+=imgHtml(imgPath,'item-icon');
    html+='<div class="item-title">';
    html+='<div class="item-name">'+escHtml(w.name)+'</div>';
    html+='<div class="item-type">'+escHtml(w.weapon_type||'')+' | '+(w.handedness||'')+' | '+rarityName+'</div>';
    html+='</div></div>';
    html+='<div class="item-stats">';
    if(w.damage_stats&&w.damage_stats.base_damage){
      Object.keys(w.damage_stats.base_damage).forEach(function(k){
        var v=w.damage_stats.base_damage[k];
        if(v>0){html+='<div class="stat-line"><span class="stat-label">'+k.charAt(0).toUpperCase()+k.slice(1)+'</span><span class="stat-value">'+v+'</span></div>';}
      });
      if(w.damage_stats.impact){html+='<div class="stat-line"><span class="stat-label">Impact</span><span class="stat-value">'+w.damage_stats.impact+'</span></div>';}
      if(w.damage_stats.attack_speed){html+='<div class="stat-line"><span class="stat-label">Speed</span><span class="stat-value">'+w.damage_stats.attack_speed+'</span></div>';}
      if(w.damage_stats.stamina_cost){html+='<div class="stat-line"><span class="stat-label">Stam Cost</span><span class="stat-value">'+w.damage_stats.stamina_cost+'</span></div>';}
    }
    html+='<div class="stat-line"><span class="stat-label">Weight</span><span class="stat-value">'+(w.weight||0)+'</span></div>';
    if(w.durability){html+='<div class="stat-line"><span class="stat-label">Durability</span><span class="stat-value">'+w.durability+'</span></div>';}
    html+='</div>';
    if(w.special_effects&&w.special_effects.length>0){
      html+='<div class="effects-section">';
      html+='<div class="effects-title">Effects on Hit:</div>';
      html+='<div class="effect-tags">';
      w.special_effects.forEach(function(fx){

function equipWeapon(name){
  var w=findWeapon(name);
  if(!w)return;
  if(!BUILD.weapons)BUILD.weapons={};

    BUILD.weapons['weapon_main']=name;

    else{BUILD.weapons['weapon_main']=name;}

function unequipWeapon(name){

function filterSkillsByClass(cls){
  SKILL_CLASS_FILTER=cls;
  var pills=document.querySelectorAll('#skill-class-filters .pill');
  var labels=['All'];
  for(var i=0;i<DATA.classes.length;i++)labels.push(DATA.classes[i].name);

function hasRequirement(skill){
  return skill.requires_skill && skill.requires_skill !== 'None' && skill.requires_skill !== null && skill.requires_skill !== '';
}

function hasExclusion(skill){
  return skill.excludes_skill && skill.excludes_skill !== 'None' && skill.excludes_skill !== null && skill.excludes_skill !== '';
}

function getSkillStatus(skill){
  var isSelected=(BUILD.skills||[]).indexOf(skill.name)>=0;
  if(isSelected)return 'selected';
  if(BUILD.theorycraft)return 'available';
  for(var i=0;i<(BUILD.skills||[]).length;i++){
    var selSkill=findSkill(BUILD.skills[i]);
    if(selSkill&&hasExclusion(selSkill)&&selSkill.excludes_skill===skill.name){return 'excluded:'+selSkill.name;}
  }
  if(hasRequirement(skill)){
    var reqIdx=(BUILD.skills||[]).indexOf(skill.requires_skill);
    if(reqIdx<0){return 'requires:'+skill.requires_skill;}
  }
  // Tier 2 does NOT require Tier 1 - they are independent choices
  if(skill.tier===3){
    var hasT2=false;
    (BUILD.skills||[]).forEach(function(n){
      var s=findSkill(n);
      if(s&&s.parent_class===skill.parent_class&&s.tier===2){hasT2=true;}
    });
    if(!hasT2){return 'requires-t2';}
  }
  if(skill.costs_breakthrough&&(BUILD.breakthroughsUsed||0)>=3){return 'no-bt';}
  return 'available';
}

function renderSkillsList(){
  var container=document.getElementById('skills-list');
  if(!container)return;
  var filtered=DATA.skills.filter(function(s){
    if(SKILL_CLASS_FILTER&&s.parent_class!==SKILL_CLASS_FILTER)return false;
    if(SKILL_SEARCH){
      var q=SKILL_SEARCH.toLowerCase();
      if(s.name.toLowerCase().indexOf(q)<0&&(!s.effects||s.effects.toLowerCase().indexOf(q)<0))return false;
    }
    return true;
  });
  var byClass={};
  filtered.forEach(function(s){
    if(!byClass[s.parent_class])byClass[s.parent_class]=[];
    byClass[s.parent_class].push(s);
  });
  Object.keys(byClass).forEach(function(k){
    byClass[k].sort(function(a,b){
      var order=function(t){return t===0?4:t;};
      return order(a.tier)-order(b.tier);
    });
  });
  var html='';
  for(var i=0;i<DATA.classes.length;i++){
    var cls=DATA.classes[i];
    var skills=byClass[cls.name];
    if(!skills||skills.length===0)continue;
    html+='<div class="class-section">';
    html+='<div class="class-header">';
    var clsImg=getItemImage(cls,'skill');
    html+=imgHtml(clsImg,'class-icon');
    html+='<div class="class-info"><h3>'+escHtml(cls.name)+'</h3><p>'+escHtml(cls.teacher)+' \u2014 '+escHtml(cls.location)+'</p></div>';
    if(cls.is_dlc)html+='<span class="class-dlc">DLC</span>';
    html+='</div>';
    var tiers={1:[],2:[],3:[],0:[]};
    skills.forEach(function(s){
      var t=s.tier||1;
      if(!tiers[t])tiers[t]=[];
      tiers[t].push(s);
    });
    var tierNames={1:'Tier 1',2:'Tier 2 (Breakthrough)',3:'Tier 3',0:'Special'};
    [1,2,3,0].forEach(function(t){
      if(tiers[t].length===0)return;
      html+='<div class="tier-section">';
      html+='<div class="tier-label">'+tierNames[t]+'</div>';
      for(var j=0;j<tiers[t].length;j++){
        var skill=tiers[t][j];
        var status=getSkillStatus(skill);
        var isSel=status==='selected';
        var isLocked=status.indexOf('requires:')===0||status.indexOf('excluded:')===0||status==='no-bt'||status==='requires-t1'||status==='requires-t2';
        var isBreakthrough=skill.costs_breakthrough;
        var skillImg=getItemImage(skill,'skill');
        var cardClass='skill-item';
        if(isSel)cardClass+=' selected';
        if(isLocked)cardClass+=' locked';
        if(isBreakthrough&&isSel)cardClass+=' breakthrough';
        html+='<div class="'+cardClass+'" '+makeClick('toggleSkill',skill.name)+'>';
        html+=imgHtml(skillImg,'');
        html+='<div class="skill-info">';
        html+='<div class="skill-name">'+escHtml(skill.name)+'</div>';
        var meta=[];
        if(skill.skill_type)meta.push(skill.skill_type);
        if(skill.subtype)meta.push(skill.subtype);
        if(skill.mana_cost)meta.push(skill.mana_cost+' Mana');
        if(skill.stamina_cost)meta.push(skill.stamina_cost+' Stam');
        if(skill.cooldown)meta.push('CD '+skill.cooldown);
        html+='<div class="skill-meta">'+escHtml(meta.join(' \u00B7 '))+'</div>';
        if(status.indexOf('requires:')===0){
          var reqName=status.substring(9);
          html+='<div class="skill-req">\u26A0\uFE0F Requires: '+escHtml(reqName)+'</div>';

        }else if(status==='requires-t2'){
          html+='<div class="skill-req">\u26A0\uFE0F Requires Tier 2 Breakthrough from this class</div>';
        }else if(status.indexOf('excluded:')===0){
          var exclName=status.substring(9);
          html+='<div class="skill-excl">\uD83D\uDEAB Excluded by: '+escHtml(exclName)+'</div>';
        }else if(status==='no-bt'){
          html+='<div class="skill-excl">\uD83D\uDEAB No breakthrough points left</div>';
        }
        if(skill.description){html+='<div class="skill-desc">'+escHtml(cleanDesc(skill.description))+'</div>';}
        if(skill.effects){html+='<div class="skill-desc" style="color:var(--gold)">'+escHtml(cleanDesc(skill.effects))+'</div>';}
        if(skill.cost){html+='<div class="skill-cost">\uD83D\uDCB0 Cost: '+escHtml(skill.cost)+'</div>';}
        if(skill.trainer){
          html+='<div class="skill-meta" style="margin-top:4px">\uD83D\uDCCD '+escHtml(skill.trainer);
          if(skill.location)html+=' ('+escHtml(skill.location)+')';
          html+='</div>';
        }
        html+='</div>';
        html+='<span class="skill-tier-badge'+(t===2?' t2':t===3?' t3':'')+'">'+(t===0?'SP':(isBreakthrough?'BT T'+t:'T'+t))+'</span>';
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  }
  container.innerHTML=html;
}

function toggleSkill(name){
  var idx=(BUILD.skills||[]).indexOf(name);
  var skill=findSkill(name);
  var isBT=skill&&skill.costs_breakthrough;
  if(idx>=0){
    BUILD.skills.splice(idx,1);
    if(isBT)BUILD.breakthroughsUsed=(BUILD.breakthroughsUsed||0)-1;
    var toRemove=[];
    (BUILD.skills||[]).forEach(function(sName){
      var s=findSkill(sName);
      if(s&&hasRequirement(s)&&s.requires_skill===name){toRemove.push(sName);}
    });
    toRemove.forEach(function(sName){
      var rIdx=BUILD.skills.indexOf(sName);
      if(rIdx>=0){
        var rSkill=findSkill(sName);
        if(rSkill&&rSkill.costs_breakthrough){BUILD.breakthroughsUsed=(BUILD.breakthroughsUsed||0)-1;}
        BUILD.skills.splice(rIdx,1);
      }
    });
  }else{
    var status=getSkillStatus(skill);
    if(status.indexOf('requires:')===0||status.indexOf('excluded:')===0||status==='no-bt'||status==='requires-t2'){return;}
    BUILD.skills.push(name);
    if(isBT)BUILD.breakthroughsUsed=(BUILD.breakthroughsUsed||0)+1;
  }
  saveBuild();renderSkillsList();renderBuilder();
}

function renderFactionsTab(pane){
  var html='';
  if(!BUILD.faction){
    html+='<div style="font-size:12px;color:var(--dim);margin-bottom:12px;padding:0 4px">Choose your faction:</div>';
    for(var i=0;i<DATA.factions.length;i++){
      var f=DATA.factions[i];
      html+='<div class="faction-card" '+makeClick('selectFaction',f.id)+'>';
      html+='<div class="faction-name">'+escHtml(f.name)+'</div>';
      html+='<div class="faction-desc">'+escHtml(cleanDesc(f.description||''))+'</div>';
      html+='</div>';
    }
  }else{
    var selFaction=null;
    for(var j=0;j<DATA.factions.length;j++){
      if(DATA.factions[j].id===BUILD.faction){selFaction=DATA.factions[j];break;}
    }
    if(selFaction){
      html+='<div class="faction-card selected" '+makeClick('selectFaction',selFaction.id)+'>';
      html+='<div class="faction-name">'+escHtml(selFaction.name)+' \u2713</div>';
      html+='</div>';
      var factionQuests=DATA.quests.filter(function(q){
        if(q.faction!==BUILD.faction&&q.faction!==selFaction.name)return false;
        // Only show quests with item or skill rewards
        if(!q.rewards)return false;
        var r=q.rewards;
        var hasRewards=(r.items&&r.items.length>0)||(r.skills&&r.skills.length>0);
        // Also check outcomes
        if(!hasRewards&&q.outcomes){
          q.outcomes.forEach(function(o){
            if(o.rewards&&((o.rewards.items&&o.rewards.items.length>0)||(o.rewards.skills&&o.rewards.skills.length>0)))hasRewards=true;
          });
        }
        return hasRewards;
      });
      if(factionQuests.length>0){
        html+='<div class="filter-label" style="margin-top:12px">Quests ('+factionQuests.length+')</div>';
        for(var m=0;m<factionQuests.length;m++){html+=renderQuestCard(factionQuests[m]);}
        var totalSkills=0;var totalItems=0;
        factionQuests.forEach(function(q){
          var sel=QUEST_SELECTIONS[q.name];
          var rewardsToCount=[];
          if(sel&&q.outcomes){q.outcomes.forEach(function(o){if(o.name===sel&&o.rewards)rewardsToCount.push(o.rewards);});}
          else if(q.rewards){rewardsToCount.push(q.rewards);}
          rewardsToCount.forEach(function(r){
            if(r.skills)totalSkills+=r.skills.length;
            if(r.items)totalItems+=r.items.length;
          });
        });
        html+='<div class="total-rewards">';
        html+='<div class="total-rewards-title">Total Rewards</div>';
        html+='<div class="total-rewards-value">'+totalSkills+' skills, '+totalItems+' items</div>';
        html+='</div>';
      }else{
        html+='<div style="color:var(--dim);padding:16px;text-align:center">No quests found for this faction</div>';
      }
    }
    html+='<div class="filter-label" style="margin-top:16px">Other Factions</div>';
    for(var k=0;k<DATA.factions.length;k++){
      if(DATA.factions[k].id!==BUILD.faction){
        html+='<div class="faction-card" '+makeClick('selectFaction',DATA.factions[k].id)+'>';
        html+='<div class="faction-name" style="font-size:14px">'+escHtml(DATA.factions[k].name)+'</div>';
        html+='</div>';
      }
    }
  }
  pane.innerHTML=html;
}

function renderQuestCard(quest){
  var html='<div class="quest-item">';
  html+='<div class="quest-name">'+escHtml(quest.name||'Unknown Quest')+'</div>';
  if(quest.description){html+='<div class="quest-desc">'+escHtml(cleanDesc(quest.description))+'</div>';}
  if(quest.outcomes&&quest.outcomes.length>0){
    html+='<div class="filter-label" style="margin-top:8px">Choose your reward:</div>';
    var selectedOutcome=QUEST_SELECTIONS[quest.name];
    for(var o=0;o<quest.outcomes.length;o++){
      var outcome=quest.outcomes[o];
      var isSel=selectedOutcome===outcome.name;
      html+='<div class="quest-outcome'+(isSel?' selected':'')+'" '+makeClick('selectOutcome',quest.name+'|'+outcome.name)+'>';
      html+='<div class="outcome-name">'+escHtml(outcome.name)+'</div>';
      if(outcome.rewards){
        html+='<div class="reward-cards">';
        html+=renderRewardCards(outcome.rewards,isSel);
        html+='</div>';
      }
      if(outcome.locks){html+='<div class="locks-warning">\u26A0\uFE0F Locks: '+escHtml(outcome.locks.join(', '))+'</div>';}
      html+='</div>';
    }
  }else if(quest.rewards){
    html+='<div class="reward-cards">';
    html+=renderRewardCards(quest.rewards,true);
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function renderRewardCards(rewards,isSelected){
  var html='';
  // Only show skills and items - skip silver, reputation, etc.
  if(rewards.skills&&rewards.skills.length>0){
    rewards.skills.forEach(function(skill){
      var skillName=typeof skill==='string'?skill:skill.name||'Unknown';
      var skillType=typeof skill==='object'?(skill.type||''):'';
      var typeLabel=skillType==='passive'?'(Passive)':skillType==='active'?'(Active)':'';
      var skillData=findSkill(skillName);
      var skillImg=skillData?getItemImage(skillData,'skill'):null;
      html+='<div class="reward-card'+(isSelected?' selected':'')+'">';
      if(isSelected)html+='<div class="reward-check">\u2713</div>';
      html+=imgHtml(skillImg,'');
      html+='<div class="reward-card-name">'+escHtml(skillName)+'</div>';
      html+='<div class="reward-card-type">\u26A1 Skill '+typeLabel+'</div>';
      if(skillData){
        if(skillData.description){html+='<div class="reward-card-desc">'+escHtml(cleanDesc(skillData.description))+'</div>';}
        if(skillData.effects){html+='<div class="reward-card-desc" style="color:var(--gold)">'+escHtml(cleanDesc(skillData.effects))+'</div>';}
      }
      html+='</div>';
    });
  }
  if(rewards.items&&rewards.items.length>0){
    rewards.items.forEach(function(item){
      var itemName=typeof item==='string'?item:(item.name||item.item||'Unknown');
      var qty=typeof item==='object'?(item.qty||item.quantity||''):'';
      var itemData=findWeapon(itemName)||findArmor(itemName)||findConsumable(itemName);
      var itemType=itemData?(itemData.weapon_type?'weapon':itemData.slot?'armor':'consumable'):null;
      var itemImg=itemData?getItemImage(itemData,itemType):null;
      html+='<div class="reward-card'+(isSelected?' selected':'')+'">';
      if(isSelected)html+='<div class="reward-check">\u2713</div>';
      html+=imgHtml(itemImg,'');
      html+='<div class="reward-card-name">'+escHtml(itemName)+(qty?' x'+qty:'')+'</div>';
      html+='<div class="reward-card-type">\uD83D\uDCE6 Item</div>';
      if(itemData){
        if(itemData.description){html+='<div class="reward-card-desc">'+escHtml(cleanDesc(itemData.description))+'</div>';}
        var stats='';
        if(itemData.damage_stats&&itemData.damage_stats.base_damage){
          Object.keys(itemData.damage_stats.base_damage).forEach(function(k){
            var v=itemData.damage_stats.base_damage[k];
            if(v>0)stats+=k.substring(0,3)+': '+v+' ';
          });
        }else if(itemData.protection){stats='PROT: '+itemData.protection;}
        if(stats){html+='<div class="reward-card-desc" style="color:var(--gold)">'+escHtml(stats)+'</div>';}
      }
      html+='</div>';
    });
  }
  return html;
}

      html+='<div class="source-section">';
      html+='<div class="source-title">\uD83D\uDCE6 Source:</div>';
      html+='<div class="source-text">'+escHtml(c.source)+'</div>';
      html+='</div>';
    }
    html+='</div></div>';
  }
  container.innerHTML=html;
}

function toggleCons(name){
  var idx=(BUILD.consumables||[]).indexOf(name);
  if(idx>=0){
    BUILD.consumables.splice(idx,1);
    if(BUILD.quickSlots){for(var i=0;i<BUILD.quickSlots.length;i++){if(BUILD.quickSlots[i]===name)BUILD.quickSlots[i]=null;}}
  }else{
    BUILD.consumables.push(name);
    if(BUILD.quickSlots){for(var j=0;j<BUILD.quickSlots.length;j++){if(!BUILD.quickSlots[j]){BUILD.quickSlots[j]=name;break;}}}
  }
  saveBuild();renderConsList();renderBuilder();
}

function renderEffectsTab(pane){
  var html='';
  html+='<input class="search-bar" placeholder="Search effects..." oninput="effectSearch(this.value)">';
  html+='<div id="effects-list"></div>';
  pane.innerHTML=html;
  renderEffectsList();
}

function effectSearch(val){EFFECT_SEARCH=val;renderEffectsList();}

function renderEffectsList(){
  var container=document.getElementById('effects-list');
  if(!container)return;
  var filtered=DATA.effects.filter(function(e){
    if(EFFECT_SEARCH){
      var q=EFFECT_SEARCH.toLowerCase();
      if((e.name||'').toLowerCase().indexOf(q)<0&&(!e.description||e.description.toLowerCase().indexOf(q)<0))return false;
    }
    return true;
  });
  var html='';
  for(var i=0;i<filtered.length;i++){
    var e=filtered[i];
    var imgPath=getItemImage(e,'effect');
    html+='<div class="effect-item">';
    html+=imgHtml(imgPath,'');
    html+='<div class="effect-info">';
    html+='<div class="effect-name">'+escHtml(e.name||'Unknown')+'</div>';
    var statsHtml='';
    if(e.damage)statsHtml+='\uD83D\uDCA5 Damage: '+escHtml(e.damage)+' ';
    if(e.duration)statsHtml+='\u23F1\uFE0F Duration: '+escHtml(e.duration)+' ';
    if(e.chance)statsHtml+='\uD83C\uDFAF Chance: '+escHtml(e.chance)+'%';
    if(statsHtml){html+='<div class="effect-stats">'+statsHtml+'</div>';}
    if(e.description){html+='<div class="effect-desc">'+escHtml(cleanDesc(e.description))+'</div>';}
    if(e.category){html+='<span class="effect-cat">'+escHtml(e.category)+'</span>';}
    html+='</div></div>';
  }
  container.innerHTML=html;
}

function saveBuild(){try{localStorage.setItem('outward-build',JSON.stringify(BUILD));}catch(e){}}
function toggleTheorycraft(){BUILD.theorycraft=!BUILD.theorycraft;saveBuild();renderBuilder();}

function newBuild(){
  if(confirm('Start new build? All selections will be cleared.')){
    BUILD={name:'New Build',theorycraft:false,skills:[],armor:{},weapons:{},consumables:[],faction:null,breakthroughsUsed:0,leylines:{health:100,mana:20},quickSlots:[null,null,null,null]};
    QUEST_SELECTIONS={};
    try{localStorage.removeItem('outward-build');}catch(e){}
    saveBuild();renderBuilder();
  }
}

function exportBuild(){
  var json=JSON.stringify(BUILD,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=(BUILD.name||'build').replace(/\s+/g,'_')+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBuild(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=function(){
    var f=input.files[0];
    if(!f)return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var d=JSON.parse(reader.result);
        BUILD=Object.assign({},BUILD,d);
        saveBuild();renderBuilder();
      }catch(e){alert('Invalid build file');}
    };
    reader.readAsText(f);
  };
  input.click();
}

loadData();
</script>
</body>
</html>
